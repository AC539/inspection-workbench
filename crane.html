<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>起重机报告生成器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"SimSun","宋体",serif;background:#e5e5e5;color:#000;line-height:1.5}

.toolbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:2px solid #1a56db;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-height:62vh;overflow-y:auto}
.toolbar h1{font-size:16px;color:#1a56db;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toolbar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.toolbar-grid input,.toolbar-grid select{padding:5px 7px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;background:#fafafa;width:100%}
.toolbar-grid label{font-size:11px;color:#666;display:block;margin-bottom:2px}
.toolbar-grid .h{display:none}
.toolbar-grid.showall .h{display:block}
.grp{grid-column:1/-1;font-size:11px;font-weight:700;color:#1a56db;border-bottom:1px solid #e0e7ff;padding-bottom:2px;margin-top:6px}
.btn{display:inline-block;padding:7px 14px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-right:6px}
.btn-primary{background:#1a56db;color:#fff}
.btn-secondary{background:#10b981;color:#fff}
.btn-info{background:#6366f1;color:#fff}
.btn-warn{background:#dc2626;color:#fff}
.btn:hover{opacity:.85}

.page{width:210mm;height:297mm;padding:10mm 9mm;margin:8mm auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;font-size:11px;color:#000;display:flex;flex-direction:column;overflow:hidden}
.page>*{flex-shrink:0}
.page-sm{padding:12mm 12mm}
.formid{position:absolute;top:5mm;left:9mm;font-size:10px;color:#333;letter-spacing:1px}
.pagetitle{text-align:center;font-size:24px;font-weight:700;margin:2mm 0 3mm;letter-spacing:2px}
.pagetitle-sm{text-align:center;font-size:17px;font-weight:700;margin:2mm 0 2.5mm;letter-spacing:1px}

.rt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.75;min-height:0;align-self:stretch}
.rt th,.rt td{border:1px solid #000;padding:9px 5px;vertical-align:middle}
.rt th{text-align:center;font-weight:400;font-size:14px;padding:6px 4px;white-space:nowrap;letter-spacing:0}
.rt td.c{text-align:center}
.rt td.l{text-align:left}
.rt td.v{vertical-align:middle;text-align:center;word-break:break-all;line-height:1.38}
.rt .seno{width:4.2%}
.rt .proj{width:15.5%}
.rt .cont{width:36%}
.rt .situ{width:20%}
.rt .res{width:9%}
.rt .conc{width:6.5%}
.rt .note{width:8%}
.rt .mark{font-size:16px;letter-spacing:1px}
.rt tr.sec td{font-weight:700;text-align:center;font-size:11px;background:#fafafa;letter-spacing:1px}

.cover-head{text-align:center;font-size:27px;font-weight:700;letter-spacing:2px;margin-top:30mm}
.cover-sub{text-align:center;font-size:14px;margin-top:3mm;letter-spacing:1px}
.cv-top{position:absolute;top:12mm;right:12mm;font-size:12.5px;line-height:2.1}
.cv-top .row{display:flex;gap:6px}
.cv-top .lbl{width:80px;white-space:nowrap}
.cv-top .val{min-width:104px;border-bottom:1px solid #000;text-align:center}
.cv-form{margin-top:22mm;font-size:14.5px}
.cv-form .row{display:flex;align-items:flex-end;margin-bottom:7mm;padding-left:24mm}
.cv-form .lbl{width:148px;letter-spacing:2px;white-space:nowrap}
.cv-form .val{flex:1;border-bottom:1px solid #000;padding-bottom:1px;min-height:19px;text-align:center}

.inst{font-size:13.4px;line-height:1.95;margin-top:5mm}
.inst p{margin-bottom:2.5px;text-indent:0}

.pinfo{width:100%;border-collapse:collapse;font-size:12.2px;line-height:1.5;margin-top:3mm}
.pinfo th,.pinfo td{border:1px solid #000;padding:4.2px 5px;vertical-align:middle}
.pinfo td.k{text-align:center;letter-spacing:2px;width:26%}
.pinfo td.vv{text-align:center;width:24%}
.pinfo td.wide{text-align:center}
.pinfo .grp{width:4%;text-align:center;letter-spacing:1px}
.pinfo .unit{width:5%;text-align:center}
.pinfo .remark{height:28mm;vertical-align:top;text-align:left;padding:4px 6px;line-height:2}

.cond{font-size:12.6px;line-height:1.8;padding:4px 5px}
.cond div{margin-bottom:1px}

.ap-t{font-size:10px;text-align:center}
.ap-l{font-size:11px;font-weight:700;margin-bottom:1mm}
.ap-box{min-height:190mm;border:1px solid #000;padding:4mm;font-size:13.5px}
.underline{display:inline-block;min-width:52px;border-bottom:1px solid #000;text-align:center;padding:0 3px;font-weight:700}

.tip{font-size:11px;color:#666;padding:4px 0}
.bar{font-size:11px;color:#1a56db;background:#eff6ff;padding:4px 10px;border-radius:4px}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;left:0;width:330px;height:100vh;background:#fff;box-shadow:2px 0 12px rgba(0,0,0,.15);z-index:201;overflow-y:auto;transform:translateX(-100%);transition:transform .2s}
.sidebar.show{transform:translateX(0)}
.sb-head{padding:12px 14px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sb-close{cursor:pointer;font-size:20px;color:#888;background:none;border:none}
.proj-item{border-bottom:1px solid #f0f0f0}
.proj-name{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.proj-name:hover{background:#f0f5ff}
.proj-acts{display:flex;gap:6px}
.proj-acts button{background:none;border:none;cursor:pointer;font-size:12px;color:#888;padding:2px 6px}
.proj-acts button:hover{color:#1a56db}
.proj-acts .del:hover{color:#dc2626}
.unit-list{display:none;padding:0 0 8px 18px}
.unit-list.show{display:block}
.unit-item{padding:6px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-radius:4px}
.unit-item:hover{background:#eff6ff}
.unit-item.active{background:#dbeafe;color:#1a56db;font-weight:600}
.unit-item .del{color:#ccc;cursor:pointer;font-size:14px}
.unit-item .del:hover{color:#dc2626}
.add-btn{padding:8px 14px;margin:6px 14px;background:#eff6ff;border:1px dashed #1a56db;border-radius:6px;cursor:pointer;font-size:13px;color:#1a56db;text-align:center}
.add-btn:hover{background:#dbeafe}

#badPanel{display:none;position:fixed;top:64px;right:12px;width:400px;max-height:82vh;overflow-y:auto;background:#fff;border:2px solid #dc2626;border-radius:8px;padding:12px;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.18)}
#badPanel h3{font-size:14px;color:#dc2626;margin-bottom:8px}
#badPanel .line{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}
#badPanel input,#badPanel select,#badPanel textarea{border:1px solid #d1d5db;border-radius:4px;padding:4px 6px;font-size:12px;width:100%}
#badPanel textarea{min-height:40px;resize:vertical}
.badrow{border:1px solid #fecaca;background:#fff5f5;border-radius:6px;padding:8px;margin-bottom:8px;position:relative}
.badrow .delbad{position:absolute;top:4px;right:6px;border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px}

@media print{
  body{background:#fff}
  .toolbar,.sidebar,.sidebar-overlay,#badPanel{display:none!important}
  .page{margin:0;box-shadow:none;page-break-after:always;page-break-inside:avoid}
  .page:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>
    <span>🏗 起重机定期检验原始记录生成器</span>
    <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="bar" id="currLabel">未选择项目</span>
      <button class="btn" style="background:#6366f1;color:#fff;font-size:12px;padding:5px 12px" onclick="saveCurrent()">💾 保存到当前</button>
      <button class="btn" style="font-size:12px;padding:5px 12px" onclick="toggleSidebar()">📁 项目管理</button>
    </span>
  </h1>

  <div class="toolbar-grid">
    <div class="grp h">① 设备与使用单位信息</div>
    <div class="h"><label>使用单位</label><input id="i_unit" value="四川省昌轩建筑工程有限责任公司" oninput="render()"></div>
    <div class="h"><label>使用单位地址</label><input id="i_addr" value="彭州市牡丹大道中段38号" oninput="render()"></div>
    <div class="h"><label>使用地点</label><input id="i_place" value="彭州市牡丹大道中段38号下料跨（中）" oninput="render()"></div>
    <div class="h"><label>统一社会信用代码</label><input id="i_credit" value="91510100MA6CL14D8L" oninput="render()"></div>
    <div class="h"><label>安全管理人员</label><input id="i_safe" value="周宇" oninput="render()"></div>
    <div class="h"><label>联系电话</label><input id="i_tel" value="13388175789" oninput="render()"></div>
    <div class="h"><label>邮政编码</label><input id="i_zip" value="/" oninput="render()"></div>
    <div class="h"><label>制造单位</label><input id="i_maker" value="成都三江起重机制造有限公司" oninput="render()"></div>
    <div class="h"><label>改造(重大修理)单位</label><input id="i_mod" value="/" oninput="render()"></div>

    <div class="grp h">② 设备参数</div>
    <div class="h"><label>设备类别</label>
      <select id="i_cat" onchange="render()">
        <option value="桥式起重机" selected>桥式起重机</option>
        <option value="门式起重机">门式起重机</option>
      </select>
    </div>
    <div class="h"><label>起重机型式</label>
      <select id="i_ctype" onchange="typeChange()">
        <option value="电动单梁" selected>电动单梁</option>
        <option value="通用桥式">通用桥式</option>
        <option value="电动葫芦门式">电动葫芦门式</option>
        <option value="通用门式">通用门式</option>
        <option value="其他特殊类别">其他特殊类别</option>
      </select>
    </div>
    <div id="box_ctypeOther" style="display:none"><label>其他型式说明</label><input id="i_ctypeOther" value="" oninput="render()" placeholder="手动填写具体型式"></div>
    <div class="h"><label>设备品种</label><input id="i_kind" value="电动单梁起重机" oninput="render()"></div>
    <div class="h"><label>型号规格</label><input id="i_model" value="LD10-22.5" oninput="render()"></div>
    <div class="h"><label>设备代码</label><input id="i_devcode" value="417051018220010030957" oninput="render()"></div>
    <div class="h"><label>产品编号</label><input id="i_prod" value="09109" oninput="render()"></div>
    <div class="h"><label>单位内编号</label><input id="i_inner" value="2#" oninput="render()"></div>
    <div class="h"><label>额定起重量 (t)</label><input id="i_cap" value="10" oninput="render()"></div>
    <div class="h"><label>跨度 (m)</label><input id="i_span" value="22.5" oninput="render()"></div>
    <div class="h"><label>起升速度 (m/min)</label><input id="i_speed" value="7" oninput="render()"></div>
    <div class="h"><label>起升高度 (m)</label><input id="i_h" value="12" oninput="render()"></div>
    <div class="h"><label>整机工作级别</label><input id="i_level" value="A3" oninput="render()"></div>
    <div class="h"><label>防爆等级</label><input id="i_ex" value="/" oninput="render()"></div>
    <div class="h"><label>其他主要参数</label><input id="i_other" value="/" oninput="render()"></div>
    <div class="h"><label>工作环境</label>
      <select id="i_env" onchange="render()">
        <option value="非露天" selected>非露天</option>
        <option value="露天">露天</option>
      </select>
    </div>
    <div class="h"><label>投入使用日期</label><input id="i_used" value="/" oninput="render()"></div>
    <div class="h"><label>设计使用年限</label><input id="i_life" value="/" oninput="render()"></div>
    <div class="h"><label>下次检验日期</label><input id="i_next" value="2028年07月01日" oninput="render()"></div>

    <div class="grp h">③ 结构特征</div>
    <div class="h"><label>主要结构特征</label><input id="i_struct" value="单主梁" oninput="render()"></div>
    <div class="h"><label>主梁结构形式</label><input id="i_girder" value="正轨箱形梁" oninput="render()"></div>
    <div class="h"><label>电气操作装置</label><input id="i_ctrl" value="无线遥控装置" oninput="render()"></div>
    <div class="h"><label>吊具</label><input id="i_hook" value="吊钩" oninput="render()"></div>
    <div class="h"><label>小车形式</label><input id="i_trolley" value="单小车" oninput="render()"></div>

    <div class="grp">④ 配置开关（决定检验项是否适用，逐台确认）</div>
    <div><label>门、梯子、走台、栏杆</label>
      <select id="c_door" onchange="render()"><option value="无" selected>无</option><option value="有">有</option></select>
    </div>
    <div><label>司机室</label>
      <select id="c_cabin" onchange="render()"><option value="无" selected>无</option><option value="有">有</option></select>
    </div>
    <div><label>无线遥控装置</label>
      <select id="c_remote" onchange="render()"><option value="有" selected>有</option><option value="无">无</option></select>
    </div>
    <div><label>变速功能</label>
      <select id="c_vspeed" onchange="render()"><option value="无" selected>无</option><option value="有">有</option></select>
    </div>
    <div><label>可进入桥架</label>
      <select id="c_bridge" onchange="render()"><option value="无" selected>无</option><option value="有">有</option></select>
    </div>
    <div><label>起升机构</label>
      <select id="c_hoist" onchange="render()"><option value="电动葫芦" selected>电动葫芦</option><option value="卷扬式">卷扬式（非电动葫芦）</option></select>
    </div>
    <div><label>轨道清扫器</label>
      <select id="c_clean" onchange="render()"><option value="无" selected>无</option><option value="有">有</option></select>
    </div>
    <div><label>防碰撞装置</label>
      <select id="c_coll" onchange="render()"><option value="有" selected>有</option><option value="无">无</option></select>
    </div>
    <div><label>钢丝绳数量</label>
      <select id="c_rope" onchange="render()"><option value="单钢丝绳" selected>单钢丝绳（1组）</option><option value="双钢丝绳">双钢丝绳（2组）</option></select>
    </div>
    <div><label>安全监控管理系统</label>
      <select id="c_mon" onchange="render()"><option value="未配置" selected>未配置</option></select>
    </div>

    <div class="grp h">⑤ 实测与检验信息</div>
    <div class="h"><label>压板数</label><input id="m_clamp" value="3" oninput="render()"></div>
    <div class="h"><label>安全圈数</label><input id="m_turn" value="4" oninput="render()"></div>
    <div class="h"><label>绳卡数</label><input id="m_clip" value="/" oninput="render()"></div>
    <div class="h"><label>绳卡间距 (mm)</label><input id="m_gap" value="/" oninput="render()"></div>
    <div class="h"><label>接地 TN (Ω)</label><input id="m_tn" value="2" oninput="render()"></div>
    <div class="h"><label>接地 TT/IT (Ω)</label><input id="m_tt" value="/" oninput="render()"></div>
    <div class="h"><label>清扫器间隙 (mm)</label><input id="m_clean" value="/" oninput="render()"></div>
    <div class="h"><label>绝缘电阻 (MΩ)</label><input id="m_ins" value=">550" oninput="render()"></div>
    <div class="h"><label>工具箱号</label><input id="m_box" value="3-12" oninput="render()"></div>
    <div class="h"><label>初检日期</label><input id="i_d1" value="2026-09-24" oninput="render()"></div>
    <div class="h"><label>整改复检日期</label><input id="i_d2" value="2026-10-14" oninput="render()"></div>
    <div class="h"><label>流水号</label><input id="i_sn" value="" oninput="render()"></div>
    <div class="h"><label>报告编号</label><input id="i_rep" value="" oninput="render()"></div>
    <div class="h"><label>收费金额</label><input id="i_fee" value="" oninput="render()"></div>
    <div class="h"><label>使用登记证编号</label><input id="i_reg" value="" oninput="render()"></div>
    <div class="h"><label>检验人员</label><input id="i_ins1" value="" oninput="render()"></div>
    <div class="h"><label>校核人员</label><input id="i_ins2" value="" oninput="render()"></div>
    <div class="h"><label>审核人员</label><input id="i_ins3" value="" oninput="render()"></div>
    <div class="h"><label>录入人员</label><input id="i_ins4" value="" oninput="render()"></div>
  </div>

  <div style="margin-top:10px">
    <button class="btn btn-primary" onclick="window.print()">🖨 打印 / 导出PDF</button>
    <button class="btn btn-warn" onclick="toggleBad()">⚠ 不合格项登记</button>
    <button class="btn" style="background:#64748b;color:#fff" onclick="toggleMore()">⚙ 更多字段</button>
    <button class="btn btn-secondary" onclick="loadDemoA()">📄 载入样本A(单梁)</button>
    <button class="btn btn-info" onclick="loadDemoB()">📄 载入样本B(门式·含4项不合格演示)</button>
    <span class="tip" id="stat"></span>
  </div>
</div>

<div class="sidebar-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-head">项目管理<button class="sb-close" onclick="toggleSidebar()">✕</button></div>
  <div class="add-btn" onclick="newProject()">＋ 新建项目</div>
  <div id="projList"></div>
</div>

<div id="badPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h3>⚠ 不合格项登记（触发双段式结论）</h3>
    <button onclick="toggleBad()" style="border:none;background:none;cursor:pointer;font-size:18px">✕</button>
  </div>
  <div id="badList"></div>
  <button class="btn btn-warn" style="font-size:12px;padding:5px 10px" onclick="addBad()">＋ 添加不合格项</button>
  <div style="font-size:11px;color:#666;margin-top:8px;line-height:1.6">
    说明：有不合格项时，检验日期自动取「初检日期 → 整改复检日期」，报告备注自动汇总
    「条款号 + 复检合格。」，附录3 自动登记。
  </div>
</div>

<div id="out"></div>

<script>
/* ============================================================
   配置读取
   ============================================================ */
function cfg(){
  const g = id => document.getElementById(id).value;
  return {
    unit:g('i_unit'), addr:g('i_addr'), place:g('i_place'), credit:g('i_credit'),
    safe:g('i_safe'), tel:g('i_tel'), zip:g('i_zip'), maker:g('i_maker'), mod:g('i_mod'),
    cat:g('i_cat'), kind:g('i_kind'), ctype:g('i_ctype'), ctypeOther:g('i_ctypeOther'), model:g('i_model'), devcode:g('i_devcode'),
    prod:g('i_prod'), inner:g('i_inner'), cap:g('i_cap'), span:g('i_span'),
    speed:g('i_speed'), h:g('i_h'), level:g('i_level'), ex:g('i_ex'),
    other:g('i_other'), env:g('i_env'), used:g('i_used'), life:g('i_life'), next:g('i_next'),
    struct:g('i_struct'), girder:g('i_girder'), ctrl:g('i_ctrl'), hook:g('i_hook'), trolley:g('i_trolley'),
    door:g('c_door'), cabin:g('c_cabin'), remote:g('c_remote'), vspeed:g('c_vspeed'),
    bridge:g('c_bridge'), hoist:g('c_hoist'), clean:g('c_clean'), coll:g('c_coll'),
    rope:g('c_rope'), mon:g('c_mon'),
    clamp:g('m_clamp'), turn:g('m_turn'), clip:g('m_clip'), gap:g('m_gap'),
    tn:g('m_tn'), tt:g('m_tt'), cleanGap:g('m_clean'), ins:g('m_ins'), box:g('m_box'),
    d1:g('i_d1'), d2:g('i_d2'), sn:g('i_sn'), rep:g('i_rep'), fee:g('i_fee'), reg:g('i_reg'),
    ins1:g('i_ins1'), ins2:g('i_ins2'), ins3:g('i_ins3'), ins4:g('i_ins4')
  };
}

let BAD = [];   // 不合格项 {no, clause, text, note}

var CTYPE_MAP = {'电动单梁':'电动单梁起重机','通用桥式':'通用桥式起重机','电动葫芦门式':'电动葫芦门式起重机','通用门式':'通用门式起重机'};
function typeChange(){
  var v = document.getElementById('i_ctype').value;
  var box = document.getElementById('box_ctypeOther');
  var kind = document.getElementById('i_kind');
  if(CTYPE_MAP[v]){

/* ============================================================
   规则引擎
   ============================================================ */
function buildItems(c){
  const out = ITEMS.map(it=>{ const o={}; for(const k in it) o[k]=it[k]; if(it.ch) o.ch=it.ch.map(x=>{const y={};for(const k in x)y[k]=x[k];return y;}); return o; });
  const get = n => out.find(x=>x.n===n);
  const hasCabin=c.cabin==='有', hasRemote=c.remote==='有', hasDoor=c.door==='有';
  const hasVs=c.vspeed==='有', inBridge=c.bridge==='有', isHoist=(c.hoist==='电动葫芦');

  // 规则001 序号7
  const i7=get(7);
  if(hasDoor){ i7.s='门、梯子、走台和栏杆符合要求'; i7.r='符合'; i7.k='√'; }
  else { i7.s='设计无门、梯子、走台和栏杆'; i7.r='不适用'; i7.k='-'; }

  // 规则003 序号15
  const i15=get(15);
  if(hasCabin){ i15.s='司机室配置及其防护符合规定'; i15.r='符合'; i15.k='√'; }
  else { i15.s='未配置司机室'; i15.r='不适用'; i15.k='-'; }

  // 规则004 序号19
  const i19=get(19);
  if(hasRemote){ i19.s='设置符合要求'; i19.r='符合'; i19.k='√'; }
  else { i19.s='未配置无线遥控装置'; i19.r='不适用'; i19.k='-'; }

  // 规则005/006/007 序号21 子项4/7/10
  const i21=get(21);
  if(hasCabin){ i21.ch[3].s='配置符合要求'; i21.ch[3].r='符合'; }
  else { i21.ch[3].s='未配置零位保护功能'; i21.ch[3].r='不适用'; }
  if(hasVs){ i21.ch[6].s='配置符合要求'; i21.ch[6].r='符合'; }
  else { i21.ch[6].s='未配置超速保护'; i21.ch[6].r='不适用'; }
  if(hasCabin||inBridge){ i21.ch[9].s='配置符合要求'; i21.ch[9].r='符合'; }
  else { i21.ch[9].s='未配置联锁保护'; i21.ch[9].r='不适用'; }

  // 规则008 序号37 整条三子项
  const i37=get(37);
  if(isHoist){
    i37.ch.forEach(x=>{ x.s='全封闭制动器、具有三合一机构的制动器和制动电机中的制动器'; x.r='不适用'; });
    i37.k='-';
  } else {
    i37.ch.forEach(x=>{ x.s='制动器零件、动作及推杆符合要求'; x.r='符合'; });
    i37.k='√';
  }

  // 规则009 / 010 序号38 子项12 / 15
  const i38=get(38);
  if(c.clean==='有'){ i38.ch[11].s='轨道清扫器符合要求'; i38.ch[11].r='符合'; }
  else { i38.ch[11].s='产品未配置轨道清扫器'; i38.ch[11].r='不适用'; }
  if(c.coll==='有'){ i38.ch[14].s='防碰撞装置符合要求'; i38.ch[14].r='符合'; }
  else { i38.ch[14].s='未配置防碰撞装置'; i38.ch[14].r='不适用'; }

  // 露天作业
  if(c.env==='露天'){
    i38.ch[9].s='障碍灯符合要求'; i38.ch[9].r='符合';
    i38.ch[10].s='风速仪及风速报警器符合要求'; i38.ch[10].r='符合';
    const i39=get(39); i39.s='隔热、降温措施符合要求'; i39.r='符合'; i39.k='√';
  }

  // 应用不合格项
  BAD.forEach(b=>{
    const it=get(Number(b.no));
    if(!it) return;
    if(it.ch && it.ch.length){
      const m=String(b.clause).match(/\.(\d+)$/);
      const idx = m ? Number(m[1])-1 : -1;
      if(idx>=0 && idx<it.ch.length){ it.ch[idx].s=b.text; it.ch[idx].r='不符合'; }
      else { it.s=b.text; it.r='不符合'; }
    } else {
      it.s=b.text; it.r='不符合'; it.k='×';
    }
  });

  // 重算父项结论
  [21,37,38].forEach(n=>{
    const it=get(n);
    if(it && it.ch){
      if(it.ch.some(x=>x.r==='不符合')) it.k='×';
      else if(it.ch.some(x=>x.r==='符合')) it.k='√';
      else it.k='-';
    }
  });

  return out;
}

/* 展开成行 */
function flatten(items){
  const rows=[]; let lastG0=null;
  items.forEach(it=>{
    const g=it.g||[];
    let g0=g[0];
    if(g0===null||g0===undefined) g0=lastG0; else lastG0=g0;
    const g1=(g.length>1 && g[1]!=null)?g[1]:null;
    if(it.ch && it.ch.length){
      it.ch.forEach((sub,si)=>rows.push({item:it,sub,si,g0,g1}));
    } else {
      rows.push({item:it,sub:null,si:0,g0,g1});
    }
  });
  return rows;
}

function calcSpan(rows,getv){
  const out=[]; let i=0;
  while(i<rows.length){
    const v=getv(rows[i]); let j=i;
    while(j<rows.length && getv(rows[j])===v) j++;
    out[i]={span:j-i,val:v};
    for(let k=i+1;k<j;k++) out[k]={span:0,val:v};
    i=j;
  }
  return out;
}

function sectionOf(n){
  if(n===1) return {key:'C2', title:'C2资料和文件审查'};
  if(n<=40) return {key:'C3', title:'C3设备检查'};
  if(n<=63) return {key:'C4', title:'C4 性能试验'};
  return {key:'C5', title:'C5其他检验和试验项目'};
}

/* ============================================================
   表格渲染
   ============================================================ */
function renderOneTable(rows){
  const useG1 = rows.some(r=>!!r.g1);
  const spG0 = calcSpan(rows,r=>r.g0||'');
  const spG1 = calcSpan(rows,r=>r.g1||'');
  const spNo = calcSpan(rows,r=>r.item.n);
  const needG1 = rows.map(()=>false);
  rows.forEach((r,i)=>{
    if(spG0[i].span){
      const grp = rows.slice(i, i+spG0[i].span);
      const any = grp.some(x=>!!x.g1);
      for(let k=i;k<i+spG0[i].span;k++) needG1[k]=any;
    }
  });
  let h='<table class="rt" style="flex-grow:'+rows.length+'"><colgroup>';
  if(useG1){
    h+='<col style="width:5%"><col style="width:7.6%"><col style="width:9.6%"><col style="width:31.4%"><col style="width:19.4%"><col style="width:9%"><col style="width:6.4%"><col style="width:11.6%">';
  } else {
    h+='<col style="width:5%"><col style="width:15.4%"><col style="width:33.4%"><col style="width:19.4%"><col style="width:9%"><col style="width:6.4%"><col style="width:11.4%">';
  }
  h+='</colgroup><thead><tr><th>序号</th><th colspan="'+(useG1?2:1)+'">检验项目</th><th>检验内容和要求</th><th>检验情况</th><th>检验结果</th><th>结论</th><th>备注</th></tr></thead><tbody>';

  rows.forEach((r,i)=>{
    h+='<tr>';
    if(spNo[i].span) h+='<td class="c" rowspan="'+spNo[i].span+'">'+r.item.n+'</td>';
    if(spG0[i].span){
      const cs=(useG1 && !needG1[i])?2:1;
      h+='<td class="v" rowspan="'+spG0[i].span+'"'+(cs>1?' colspan="2"':'')+'>'+(r.g0||'')+'</td>';
    }
    if(useG1 && needG1[i] && spG1[i].span){
      h+='<td class="v" rowspan="'+spG1[i].span+'">'+(r.g1||'')+'</td>';
    }
    h+='<td class="l">'+((r.sub?r.sub.c:r.item.c)||'').replace(/\n/g,'<br>')+'</td>';
    h+='<td class="c">'+((r.sub?r.sub.s:r.item.s)||'/')+'</td>';

function renderItemPage(pageRows){
  const groups=[];
  pageRows.forEach(r=>{
    const s=sectionOf(r.item.n);
    if(!groups.length || groups[groups.length-1].key!==s.key) groups.push({key:s.key,title:s.title,rows:[]});
    groups[groups.length-1].rows.push(r);

  let h='<div class="formid">Q-002-D</div>';
  groups.forEach(g=>{ h+='<div class="pagetitle-sm">'+g.title+'</div>'+renderOneTable(g.rows); });
  return '<div class="page">'+h+'</div>';
}

    rows+=`<tr><td class="c">`+b.no+`</td><td class="c">`+clauseNo(b.clause)+`</td><td class="c">×</td><td class="c">`+(c.d1||``)+`</td><td class="c">现场确认</td><td class="c">符合</td><td class="c mark">√</td><td class="c">`+(c.d2||``)+`</td></tr>`;
  });
  for(let i=BAD.length;i<16;i++){
    rows+=`<tr><td class="c">/</td><td class="c">/</td><td class="c">/</td><td class="c">/</td><td class="c">/</td><td class="c">/</td><td class="c mark">-</td><td class="c">/</td></tr>`;
  }
  return `<div class="page page-sm">
    <div class="formid">Q-002-D</div>
    <div style="font-size:13px;font-weight:700">附录3</div>
    <div class="pagetitle">起重机械定期初检不合格项及整改情况记录表</div>
    <table class="rt">
      <colgroup><col style="width:7%"><col style="width:15%"><col style="width:9%"><col style="width:14%"><col style="width:14%"><col style="width:11%"><col style="width:10%"><col style="width:20%"></colgroup>
      <thead><tr><th>序号</th><th>检验项目</th><th>初检<br>结论</th><th>初检日期</th><th>整改确<br>认方式</th><th>整改结果</th><th>整改<br>结论</th><th>整改情况日期</th></tr></thead>
      <tbody>`+rows+`</tbody>
    </table>
  </div>`;
}

function pgAp4(){
  return `<div class="page page-sm">
    <div class="formid">Q-002-D</div>
    <div style="font-size:13px;font-weight:700">附录4</div>
    <div class="pagetitle">记事栏</div>
    <div class="ap-box">/</div>
  </div>`;
}

/* ============================================================
   主渲染
   ============================================================ */
const PAGES=[[0,7],[7,5],[12,2],[14,2],[16,4],[20,7],[27,3],[30,5],[35,7],[42,6],[48,5],[53,6],[59,4],[63,2],[65,8],[73,6],[79,6],[85,3],[88,1]];

function render(){
  const c=cfg();
  const items=buildItems(c);
  const rows=flatten(items);

  let html='';
  html+=pgCover(c);
  html+=pgNotes();
  html+=pgParams(c);
  html+=pgBasis(c);

  PAGES.forEach(p=>{
    const seg=rows.slice(p[0],p[0]+p[1]);
    if(seg.length) html+=renderItemPage(seg);
  });

  html+=pgAp1(c);
  html+=pgAp2();
  html+=pgAp3(c);
  html+=pgAp4();

  document.getElementById('out').innerHTML=html;

  const badCnt=BAD.length;
  document.getElementById('stat').textContent =
    '共 '+rows.length+' 行 · 不合格 '+badCnt+' 项 · 检验结论：合格'+(badCnt?'（整改复检）':'');
}

/* ============================================================
   项目管理
   ============================================================ */
const KEY='crane_report_projects';
let projects=[], curPid=null, curUid=null;

function loadProjects(){ try{ projects=JSON.parse(localStorage.getItem(KEY))||[] }catch(e){ projects=[] } }
function saveProjects(){ localStorage.setItem(KEY,JSON.stringify(projects)) }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('show'); document.getElementById('sbOverlay').classList.toggle('show'); }
function renderSidebar(){
  document.getElementById('projList').innerHTML = projects.map(p=>`
    <div class="proj-item">
      <div class="proj-name" onclick="toggleProj('${p.id}')">
        <span>${p.name}</span>
        <span class="proj-acts">
          <button onclick="event.stopPropagation();addUnit('${p.id}')">＋</button>
          <button class="del" onclick="event.stopPropagation();delProj('${p.id}')">✕</button>
        </span>
      </div>
      <div class="unit-list ${p.open?'show':''}">
        ${(p.units||[]).map(u=>`<div class="unit-item ${u.id===curUid?'active':''}" onclick="loadUnit('${p.id}','${u.id}')">
          <span>${u.name}</span><span class="del" onclick="event.stopPropagation();delUnit('${p.id}','${u.id}')">✕</span>
        </div>`).join('')}
      </div>
    </div>`).join('') || '<div style="padding:16px;color:#888;font-size:13px">暂无项目，点上方新建</div>';
  const p=projects.find(x=>x.id===curPid), u=p&&(p.units||[]).find(x=>x.id===curUid);
  document.getElementById('currLabel').textContent = u ? (p.name+' / '+u.name) : '未选择项目';
}
function toggleProj(id){ const p=projects.find(x=>x.id===id); if(p){ p.open=!p.open; saveProjects(); renderSidebar(); } }
function newProject(){ const n=prompt('项目名称（如：2026年10月 彭州片区）'); if(!n) return; projects.push({id:'p'+Date.now(),name:n,open:true,units:[]}); saveProjects(); renderSidebar(); }
function delProj(id){ if(!confirm('删除该项目及其全部设备？')) return; projects=projects.filter(x=>x.id!==id); saveProjects(); renderSidebar(); }
function addUnit(pid){
  const n=prompt('设备名称（如：1# 电动单梁 10t）'); if(!n) return;
  const p=projects.find(x=>x.id===pid); p.units=p.units||[];
  const u={id:'u'+Date.now(),name:n,cfg:cfg(),bad:JSON.parse(JSON.stringify(BAD))};
  p.units.push(u); p.open=true; saveProjects(); renderSidebar();
}
function delUnit(pid,uid){ if(!confirm('删除该设备配置？')) return; const p=projects.find(x=>x.id===pid); p.units=p.units.filter(x=>x.id!==uid); saveProjects(); renderSidebar(); }
function loadUnit(pid,uid){
  const p=projects.find(x=>x.id===pid); const u=(p.units||[]).find(x=>x.id===uid);
  if(!u) return;
  curPid=pid; curUid=uid;
  if(u.cfg) setCfg(u.cfg);
  BAD = JSON.parse(JSON.stringify(u.bad||[]));
  renderBad(); render(); renderSidebar(); toggleSidebar();
}
function setCfg(c){
  const m={i_unit:'unit',i_addr:'addr',i_place:'place',i_credit:'credit',i_safe:'safe',i_tel:'tel',i_zip:'zip',i_maker:'maker',i_mod:'mod',
    i_cat:'cat',i_kind:'kind',i_ctype:'ctype',i_ctypeOther:'ctypeOther',i_model:'model',i_devcode:'devcode',i_prod:'prod',i_inner:'inner',i_cap:'cap',i_span:'span',
    i_speed:'speed',i_h:'h',i_level:'level',i_ex:'ex',i_other:'other',i_env:'env',i_used:'used',i_life:'life',i_next:'next',
    i_struct:'struct',i_girder:'girder',i_ctrl:'ctrl',i_hook:'hook',i_trolley:'trolley',
    c_door:'door',c_cabin:'cabin',c_remote:'remote',c_vspeed:'vspeed',c_bridge:'bridge',c_hoist:'hoist',
    c_clean:'clean',c_coll:'coll',c_rope:'rope',c_mon:'mon',
    m_clamp:'clamp',m_turn:'turn',m_clip:'clip',m_gap:'gap',m_tn:'tn',m_tt:'tt',m_clean:'cleanGap',m_ins:'ins',m_box:'box',
    i_d1:'d1',i_d2:'d2',i_sn:'sn',i_rep:'rep',i_fee:'fee',i_reg:'reg',
    i_ins1:'ins1',i_ins2:'ins2',i_ins3:'ins3',i_ins4:'ins4'};
  for(const id in m){ const el=document.getElementById(id); if(el && c[m[id]]!==undefined) el.value=c[m[id]]; }
  var box=document.getElementById('box_ctypeOther');
  if(box && c.ctype) box.style.display = CTYPE_MAP[c.ctype] ? 'none' : 'block';
}
function saveCurrent(){
  if(!curPid||!curUid){ alert('请先在「项目管理」里选中一台设备'); return; }
  const p=projects.find(x=>x.id===curPid); const u=(p.units||[]).find(x=>x.id===curUid);
  u.cfg=cfg(); u.bad=JSON.parse(JSON.stringify(BAD)); saveProjects(); alert('已保存到：'+u.name);
}
