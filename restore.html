<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台数据恢复</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f2f7;color:#1c1c1e;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:#fff;border-radius:18px;padding:28px 24px;max-width:520px;width:100%;
        box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{font-size:19px;margin:0 0 6px}
  .sub{font-size:13px;color:#8e8e93;margin-bottom:18px}
  .row{font-size:14px;line-height:1.9;padding:4px 0;border-bottom:1px solid #f2f2f7}
  .ok{color:#34c759;font-weight:600}
  .err{color:#ff3b30;font-weight:600}
  .btn{display:block;margin-top:20px;text-align:center;padding:14px;border-radius:12px;
       background:#007aff;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
  .num{font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>检验工作台 · 数据恢复</h1>
  <div class="sub">从云端 data.json 写回本机浏览器存储（同源写入，不经过任何第三方）</div>
  <div id="log" class="row">正在读取云端数据…</div>
  <a id="go" class="btn" href="./index.html" style="display:none">打开检验工作台</a>
</div>
<script>
(function(){
  var P='wb_check_';
  var log=document.getElementById('log');
  function line(html){ log.insertAdjacentHTML('afterend','<div class="row">'+html+'</div>'); }
  fetch('./data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    var tasks=d.tasks||[];
    if(!tasks.length) throw new Error('云端数据为空，已中止（未覆盖本地）');
    localStorage.setItem(P+'tasks', JSON.stringify(tasks));
    if(d.types) localStorage.setItem(P+'deviceTypes', JSON.stringify(d.types));
    if(d.cols)  localStorage.setItem(P+'statusColors', JSON.stringify(d.cols));
    localStorage.setItem(P+'tombstones', JSON.stringify(d.deleted||[]));
    localStorage.setItem(P+'seeded','1');

    /* 设置：保留本机已有的 token 等，只补齐默认项 */
    var cur={}; try{ cur=JSON.parse(localStorage.getItem(P+'settings')||'{}'); }catch(e){}
    var base={startDistrict:'青羊区',speedKmh:25,taskMinutes:90,startTime:'09:00',
              useMap:false,mapKey:'',syncUrl:'',syncToken:'',ghToken:'',ghRepo:'AC539/inspection-workbench-data'};
    for(var k in base){ if(cur[k]===undefined) cur[k]=base[k]; }
    localStorage.setItem(P+'settings', JSON.stringify(cur));

    var stat={}, n=0;
    tasks.forEach(function(t){ stat[t.status]=(stat[t.status]||0)+1; n++; });
    var names={pending:'待安排',scheduled:'已排期',done:'检验完成',
               report_received:'报告·收到单子',report_review:'报告·校核中',report_archived:'报告·归档完成'};
    var detail=Object.keys(stat).map(function(k){ return (names[k]||k)+' '+stat[k]; }).join(' · ');

    log.className='row ok';
    log.textContent='✓ 已写入本地存储';
    line('任务条数 <span class="num">'+n+'</span> 条');
    line(detail);
    line('仓库设置 <span class="num">'+(cur.ghRepo||'未设置')+'</span>');
    if(!cur.ghToken) line('<span class="err">Token 为空</span>：云端上传/下载需要重新填一次');
    line('完成后请按 <b>Ctrl+F5</b> 强制刷新工作台页面');
    document.getElementById('go').style.display='block';
  }).catch(function(e){
    log.className='row err';
    log.textContent='恢复失败：'+e.message;
  });
})();
</script>
</body>
</html>
