/* ================= 弹层/导航（多层栈） ================= */
var SHEET_STACK=[];
function openSheet(title,body){
  var layer=document.createElement('div');
  layer.className='sheet-layer';
  layer.style.zIndex=200+SHEET_STACK.length*10;
  layer.innerHTML='<div class="mask"></div>'
    +'<div class="sheet"><div class="sheet-head"><span class="st"></span>'
    +'<div class="head-extra" style="display:flex;gap:8px;align-items:center"></div>'
    +'<button class="icon-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="sheet-body"></div></div>';
  layer.querySelector('.st').textContent=title;
  layer.querySelector('.sheet-body').innerHTML=body;
  var mask=layer.querySelector('.mask');
  var closeBtn=layer.querySelector('.icon-btn');
  mask.addEventListener('click',function(e){ if(e.target===this) closeSheet(); });
  closeBtn.addEventListener('click',function(){ closeSheet(); });
  document.body.appendChild(layer);
  SHEET_STACK.push(layer);
  document.body.style.overflow='hidden';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ layer.classList.add('open'); }); });
  return layer;
}
function closeSheet(){
  if(!SHEET_STACK.length) return;
  var layer=SHEET_STACK.pop();
  layer.classList.remove('open');
  setTimeout(function(){
    layer.remove();
    if(!SHEET_STACK.length) document.body.style.overflow='';
  },240);
}
function refreshTopLayer(){
  var top=SHEET_STACK[SHEET_STACK.length-1];
  if(top&&typeof top.__refresh==='function') top.__refresh();
}
function showConfirm(title,desc,fn){
  document.getElementById('cfTitle').textContent=title;

function rptParseState(CFG){
  var map = {
    '超老':   { yr: 2003, b2005: true,  b2017: true,  b2023: true,  over15: true  },
    '老':     { yr: 2013, b2005: false, b2017: true,  b2023: true,  over15: false },
    '新':     { yr: 2020, b2005: false, b2017: false, b2023: true,  over15: false },
    '超新':   { yr: 2025, b2005: false, b2017: false, b2023: false, over15: false },
    '超十五年':{ yr: 2009, b2005: false, b2017: true,  b2023: true,  over15: true  }
  };
  var m = map[CFG.elevClass] || map['新'];
  var tags = [];
  if (m.b2005) tags.push('超老 ▲');
  if (m.over15) tags.push('超15年 ■');
  if (m.b2017) tags.push('2017前 ☆豁免');
  if (m.b2023) tags.push('旧规 ★豁免');
  return {
    year: m.yr, machineRoom: CFG.machineRoom, usage: CFG.usageType,
    isBefore2005: m.b2005, isBefore2017: m.b2017, isBefore2023: m.b2023,
    isOver15: m.over15, tagText: tags.join(' / ')
  };
}

/* ---- 字段定义 ----

/* ---- 配置在任务上的存取 ---- */
function getTaskCfgs(taskId){
  var t = STATE.tasks.find(function(x){return x.id===taskId;});
  if(!t) return [];
  if(!Array.isArray(t.cfgs)) t.cfgs = [];
  return t.cfgs;
}
function cfgUid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

/* ============================================================
 * 旧数据迁移 —— v1/v2 → v3
 * v1/v2 存的结构：
 *   fields.contact / fields.maintainer  → 已从表单删除
 *   fields.renovation (单文本)            → 拆成 renovated(是否) + renovation(详情)
 *   fields.brakeType = '碟式'              → 并入 '块式'
 *   cwtCount (独立数字字段)              → 并入 cwtNote 文本
 *   brakeTest = '/'                       → 视作未填（''）
 * 迁移在启动时跑一次，幂等；不改用户填的内容。
 * ============================================================ */
function migrateCfgs(){
  var changed = 0, tasks = 0;
  STATE.tasks.forEach(function(t){
    if(!Array.isArray(t.cfgs) || !t.cfgs.length) return;
    tasks++;
    t.cfgs.forEach(function(c){
      if(!c.fields) c.fields = {};
      var f = c.fields;
      var dirty = false;

      /* 1) 制动器形式：碟式 → 块式 */
      if(f.brakeType === '碟式'){ f.brakeType = '块式'; dirty = true; }

      /* 2) 改造：单文本 → 是否 + 详情 */
      if(f.renovated == null){
        if(f.renovation != null){
          var old = String(f.renovation).trim();
          f.renovated = old ? '是' : '否';
          /* 若内容里是「无 / 否 / 未改造」这类否定表述，视为没改造 */
          if(/^(无|否|没有|未改造|不适用)$/.test(old)){ f.renovated = '否'; f.renovation = ''; }
          dirty = true;
        }else{
          f.renovated = '否'; dirty = true;
        }
      }
      /* 3) 删掉已废弃字段 */
      if('contact' in f){ delete f.contact; dirty = true; }
      if('maintainer' in f){ delete f.maintainer; dirty = true; }

      /* 4) 对重块数量：并入详情文本 */
      if(c.cwtCount != null && String(c.cwtCount).trim() !== ''){
        var n = String(c.cwtCount).trim();
        var note = String(c.cwtNote||'').trim();
        if(note.indexOf(n) < 0){
          c.cwtNote = note ? (n + '块 · ' + note) : (n + '块');
        }
        delete c.cwtCount; dirty = true;
      }
      /* 5) brakeTest 的 '/' 视作未填 */
      if(c.brakeTest === '/'){ c.brakeTest = ''; dirty = true; }
      /* 6) doBrake 缺省补否 */
      if(c.doBrake == null || c.doBrake === ''){ c.doBrake = '否'; dirty = true; }
      /* 7) usage 缺省补客梯 */
      if(c.usage == null || c.usage === ''){ c.usage = '客梯'; dirty = true; }

      if(dirty){ changed++; c.updatedAt = Date.now(); }
    });
  });
  if(changed){
    try{ localStorage.setItem(K.tasks, JSON.stringify(STATE.tasks)); }catch(e){}
  }
  return { changed:changed, tasks:tasks };
}

    + '<textarea id="cfg_cwtNote" style="min-height:96px" placeholder="例如：28块（未变化）&#10;新检规：...">'+esc(cur?(cur.cwtNote||''):'')+'</textarea></div>'

/* 未填写项浅红提醒：所有字段（含选填）为空时都标浅红，填了恢复白底 */
function bindCfgFieldState(){
  var layer = SHEET_STACK[SHEET_STACK.length-1];
  if(!layer) return;
  layer.querySelectorAll('[data-field]').forEach(function(box){
    var el = box.querySelector('[data-cfg]');
    if(!el) return;
    var unf = !String(el.value||'').trim();
    box.classList.toggle('unfilled', unf);
  });
  /* 对重块材质 / 报告补充项等独立字段同样处理 */
  layer.querySelectorAll('[data-req-box]').forEach(function(box){
    var el = box.querySelector('select,input');
    if(!el) return;
    box.classList.toggle('unfilled', !String(el.value||'').trim());
  });
}

    name: g('cfg_name').trim(),
    fields: f,
    cwtMat: g('cfg_cwtMat'),
    cwtNote: g('cfg_cwtNote').trim(),

/* 保存后回到配置详情：先收掉所有弹层再重开，避免层叠遮挡 */

}

/* 从配置详情回到任务详情：同样收干净再重开 */
function backToTask(taskId){
  while(SHEET_STACK.length){
    var l = SHEET_STACK.pop();
    l.classList.remove('open');
    l.remove();
  }
  document.body.style.overflow = '';

}

function saveCfgForm(){
  var data = readCfgForm();
  var layer = SHEET_STACK[SHEET_STACK.length-1];
  var missing = CFG_REQUIRED.filter(function(k){ return !data.fields[k]; });
  if(missing.length){
    var names = missing.map(function(k){
      for(var i=0;i<CFG_SECTIONS.length;i++) for(var j=0;j<CFG_SECTIONS[i].fields.length;j++)
        if(CFG_SECTIONS[i].fields[j].k===k) return CFG_SECTIONS[i].fields[j].label;
      return k;
    });
    toast('还有 '+missing.length+' 项未填写：'+names.join('、'));
    return;
  }
  var cfgs = getTaskCfgs(CFG_EDIT.taskId);
  if(!data.name) data.name = defaultCfgName(data);
  if(CFG_EDIT.cfgId){
    var c = cfgs.find(function(x){return x.id===CFG_EDIT.cfgId;});
    if(c){ c.name=data.name; c.fields=data.fields; c.cwtMat=data.cwtMat;
           c.cwtNote=data.cwtNote; c.usage=data.usage; c.brakeTest=data.brakeTest;
           c.doBrake=data.doBrake; c.updatedAt=Date.now(); }
    toast('配置已更新');
  }else{
    cfgs.push({ id:cfgUid(), name:data.name, fields:data.fields,
      cwtMat:data.cwtMat, cwtNote:data.cwtNote, usage:data.usage, brakeTest:data.brakeTest,
      doBrake:data.doBrake, createdAt:Date.now(), updatedAt:Date.now() });
    toast('配置已保存');
  }
  saveAll();
  backToCfgDetail(CFG_EDIT.taskId);
}

function defaultCfgName(data){
  var a = data.fields.elevatorType||'';
  var b = data.fields.roomType||'';
  var s = a.replace('电梯','');
  return (s ? s : '电梯') + (b||'');
}

function copyCfgForm(taskId, cfgId){

}

/* ============================================================
 * 生成报告
 * ============================================================ */
/* 从「对重块详情」文本里解析块数，如「28块（未变化）」→ 28 */
function parseCwtCount(note){
  if(!note) return '';
  var m = String(note).match(/(\d+)\s*块/);
  return m ? m[1] : '';
}

/* 「我的工作台」配置字段 → 报告引擎字段 的映射 */
function cfgToRpt(c){
  var f = c.fields||{};
  /* 电梯类型 → 报告分类 */
  var clsMap = {
    '05年前超老电梯':'超老', '超15年电梯':'超十五年', '2017年前老电梯':'老',
    '2017年后新电梯':'新', '2024年后超新电梯':'超新'
  };
  var elevClass = clsMap[f.elevatorType] || '新';

  /* 制动器形式：鼓式 → 鼓式制动器；块式 → 块式制动器 */
  var brakeStyle = (f.brakeType==='鼓式') ? '鼓式制动器' : '块式制动器';

  /* 缓冲器类型：液压 → 耗能型；弹簧/聚氨酯 → 蓄能型 */
  var bufferType = (f.bufferType==='液压') ? '耗能型' : '蓄能型';

  /* 反绳轮材质：尼龙 → 非金属；金属 → 金属；没有 → 不适用（非金属专项要求不适用） */
  var sheaveMat = (f.sheaveMaterial==='尼龙') ? '非金属' : (f.sheaveMaterial==='没有' ? '无' : '金属');

  /* 「不适用」类选项 → 按无处理 */
  var yn = function(v){ return v==='有' ? '有' : '无'; };

  return {
    machineRoom:  f.roomType || '有机房',
    elevClass:    elevClass,
    usageType:    c.usage || '客梯',
    modification: f.renovated==='是' ? '有' : '无',
    handWheel:    yn(f.handwheel),
    emergElec:    yn(f.emergencyElectric),
    brakeStyle:   brakeStyle,
    govReset:     yn(f.autoReset),
    ascOverspeed: yn(f.upOverspeed),
    ucmp:         yn(f.unexpectedMove),
    coatedBelt:   yn(f.beltType),
    cwtSafety:    yn(f.counterSafety),
    doorCloseType: f.doorCloser || '重锤',
    sheaveMat:    sheaveMat,
    bufferType:   bufferType,
    cwtCount:     parseCwtCount(c.cwtNote) || '30',
    cwtMat:       c.cwtMat || '金属',
    safeWindow:   yn(f.safetyWindow),
    brakeTest:    c.brakeTest || '/',
    doBrakeTest:  c.doBrake || '否'
  };
}

function clsLabel(k){
  return {'超老':'超老（2005前）','超十五年':'超十五年','老':'老（2005~2016）','新':'新（2017~2023）','超新':'超新（2024后）'}[k]||k;
}

function regenReport(){
  var cfgs = getTaskCfgs(RPT_STATE.taskId);
  var c = cfgs.find(function(x){return x.id===RPT_STATE.cfgId;});
  var host = document.getElementById('rptHost');
  if(!c||!host) return;
  try{
    rptBuild(cfgToRpt(c), host);
  }catch(e){
    host.innerHTML = '<div style="padding:30px;text-align:center;color:#c00;font-size:13px">报告生成失败：'+esc(e.message)+'</div>';
    if(window.console) console.error(e);
  }
  fitReport();
}

/* A4 页宽 210mm ≈ 794px。
 * 手机窄屏 → 缩放铺满；桌面宽屏 → 按可用宽度放大（上限 1.35x：既填满屏幕又不过度失真）。
 */
var RPT_PAGE_W = 794;
var RPT_PAGE_H = 1123;
var RPT_MAX_SCALE = 1.35;
function fitReport(){
  var scroll = document.getElementById('rptScroll');
  if(!scroll) return;
  var avail = scroll.clientWidth - 12;
  var scale = avail / RPT_PAGE_W;
  if(scale > RPT_MAX_SCALE) scale = RPT_MAX_SCALE;
  if(scale <= 0) return;
  /* 缩放施加在包裹层上：页面自身保持 794px 原宽，缩放后恰好等于可用宽度 → 天然铺满且居中 */
  scroll.querySelectorAll('.rpt-fit').forEach(function(host){
    host.style.transform = 'scale('+scale+')';
    host.style.transformOrigin = 'top left';
    host.style.width = RPT_PAGE_W + 'px';
    /* 缩放后实际占位：宽度 = 794*scale，高度 = 总高*scale */
    host.style.marginRight = (avail - RPT_PAGE_W*scale) + 'px';
  });
}
/* 窗口尺寸变化 / 旋转屏幕时重排 */
var RPT_RESIZE_T;
function refitReport(){
  clearTimeout(RPT_RESIZE_T);
  RPT_RESIZE_T = setTimeout(fitReport, 120);
}
window.addEventListener('resize', refitReport);
window.addEventListener('orientationchange', refitReport);

/* ============================================================
 * 数据迁移 —— 从「我的工作台」历史记录导入
 * ============================================================ */
/* 我的工作台 ef_xxx → 本模块字段 key（联系人/维保单位已不再需要） */
var WB2CFG = {
  ef_elevatorType:'elevatorType', ef_roomType:'roomType',
  ef_handwheel:'handwheel', ef_emergencyElectric:'emergencyElectric',
  ef_autoReset:'autoReset', ef_brakeType:'brakeType', ef_upOverspeed:'upOverspeed',
  ef_unexpectedMove:'unexpectedMove', ef_beltType:'beltType',
  ef_doorCloser:'doorCloser', ef_sheaveMaterial:'sheaveMaterial',
  ef_bufferType:'bufferType', ef_safetyWindow:'safetyWindow',
  ef_counterSafety:'counterSafety'
};

/* 把一条「我的工作台」电梯历史记录转成本模块配置对象 */
function wbRecordToCfg(rec){
  var f = rec.fields || {};
  var out = {};
  Object.keys(WB2CFG).forEach(function(ef){
    var v = f[ef];
    if(v!=null && v!=='') out[WB2CFG[ef]] = String(v);
  });
  /* 制动器形式：旧数据可能是「碟式」，新表单只有块式/鼓式 → 碟式归入块式 */
  if(out.brakeType==='碟式') out.brakeType='块式';
  /* 改造情况：旧字段是自由文本 → 拆成 是否改造 + 详情 */
  var oldRen = (f.ef_renovation||'').trim();
  if(oldRen){
    out.renovated = '是';
    out.renovation = oldRen;
  }else{
    out.renovated = '否';
  }
  /* 对重块：旧的多行文本整体搬到详情 */
  var cwtText = (f.ef_counterweight||'').trim();
  return {
    name: rec.preview ? ('历史 ' + String(rec.date||'').slice(5) + ' 配置') : '导入配置',
    fields: out,
    cwtMat: '',
    cwtNote: cwtText,
    usage: '客梯',
    brakeTest: '',
    doBrake: '否',
    createdAt: rec.t || Date.now(),
    updatedAt: Date.now()
  };
}

/* 扫一遍所有电梯任务，把「我的工作台」历史挂到最匹配的标题上；无匹配则挂在第一个电梯任务 */
function importWbHistory(){
  var raw;
  try{ raw = JSON.parse(localStorage.getItem('wb_fh_elevator_history')||'[]'); }
  catch(e){ raw = []; }
  if(!raw.length){ toast('未找到「我的工作台」的电梯历史记录'); return 0; }

  var elevTasks = STATE.tasks.filter(function(t){ return (t.deviceType||'').indexOf('电梯')>=0; });
  if(!elevTasks.length){ toast('当前没有电梯任务，无法挂载'); return 0; }

  /* 已有配置全量收集，用于查重 */
  var seen = {};
  STATE.tasks.forEach(function(t){
    (t.cfgs||[]).forEach(function(c){ seen[c.name+'|'+JSON.stringify(c.fields)] = 1; });
  });

  var added = 0;
  raw.slice(0,20).reverse().forEach(function(rec){
    var cfg = wbRecordToCfg(rec);
    var key = cfg.name+'|'+JSON.stringify(cfg.fields);
    if(seen[key]) return;
    /* 按地址/名称模糊匹配任务 */
    var target = null;
    var hay = (rec.preview||'')+' '+(rec.fullText||'');
    elevTasks.forEach(function(t){
      if(target) return;
      var probe = (t.title||'')+(t.maintCo||'');
      if(probe && hay.indexOf(t.maintCo||'\u0001')>=0) target = t;
    });
    if(!target) target = elevTasks[0];
    if(!Array.isArray(target.cfgs)) target.cfgs = [];
    cfg.id = cfgUid();
    target.cfgs.push(cfg);
    seen[key] = 1;
    added++;
  });

  saveAll();
  renderAll();
  toast(added ? ('已导入 '+added+' 份历史配置') : '历史配置均已存在');
  return added;
}

/* 在设置里挂一个入口 */
function openCfgImportView(){
  var raw=[];
  try{ raw = JSON.parse(localStorage.getItem('wb_fh_elevator_history')||'[]'); }catch(e){}
  var total = STATE.tasks.reduce(function(n,t){ return n + ((t.cfgs&&t.cfgs.length)?t.cfgs.length:0); }, 0);
  var h = '<div style="font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:16px">'
    + '把「我的工作台」里已记录的电梯检验配置搬到工作台，一个项目可挂多份配置，'
    + '之后直接在工作台里生成检验报告。</div>'
    + '<div style="display:flex;gap:10px;margin-bottom:16px">'
    + '<div style="flex:1;background:var(--bg);border-radius:12px;padding:12px 14px">'
    + '<div style="font-size:20px;font-weight:700">'+(raw.length||0)+'</div>'
    + '<div style="font-size:11px;color:var(--sub);margin-top:2px">我的工作台历史记录</div></div>'
    + '<div style="flex:1;background:var(--bg);border-radius:12px;padding:12px 14px">'
    + '<div style="font-size:20px;font-weight:700">'+total+'</div>'
    + '<div style="font-size:11px;color:var(--sub);margin-top:2px">工作台现有配置</div></div>'
    + '</div>';
  h += '<button class="btn-report" onclick="doImportWb()">'
    + '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>'
    + '立即导入历史配置</button>';
  h += '<div style="font-size:12px;color:var(--hint);margin-top:12px;line-height:1.7">'
    + '导入按配置内容查重，重复的不会重复导入。若「我的工作台」数据在另一台设备，'
    + '可先用它的「数据同步」导出，再回到这里导入。</div>';
  var l = openSheet('导入电梯配置', h);
  l.__type='cfgImport';
}
function doImportWb(){
  var n = importWbHistory();
  if(n){
    while(SHEET_STACK.length){ var l=SHEET_STACK.pop(); l.classList.remove('open'); l.remove(); }
    document.body.style.overflow='';
    setTimeout(function(){
      var t = STATE.tasks.find(function(x){return x.cfgs&&x.cfgs.length;});
      if(t) openCfgDetail(t.id);
    }, 60);
  }
}

function quickReport(taskId){
  var cfgs=getTaskCfgs(taskId);
  if(!cfgs.length){ openCfgForm(taskId,null); return; }
  if(cfgs.length===1){ openReport(taskId, cfgs[0].id); return; }
  /* 多份配置：列出选择 */
  var t=STATE.tasks.find(function(x){return x.id===taskId;});
  var h='<div style="font-size:13px;color:var(--sub);margin-bottom:14px">该项目有 '+cfgs.length+' 份配置，选择要生成报告的：</div>';
  cfgs.forEach(function(c,i){
    h+='<button class="cfg-card" style="display:block;width:100%;text-align:left;border:1px solid var(--line);cursor:pointer;margin-bottom:10px" onclick="closeSheet();setTimeout(function(){openReport(\''+taskId+'\',\''+c.id+'\')},200)">'
      +'<div style="font-size:15px;font-weight:600;margin-bottom:4px">'+esc(c.name||('配置'+(i+1)))+'</div>'
      +'<div style="font-size:12px;color:var(--sub)">'+esc([(c.fields||{}).elevatorType,(c.fields||{}).roomType,'对重 '+(c.cwtCount||'-')+' 块'].filter(Boolean).join(' · '))+'</div>'
      +'</button>';
  });
  var l=openSheet('选择配置', h);
  l.__type='cfgPick';
}

/* ================= 数据迁移 ================= */
function migrateFromKeys(){
  /* 兼容：若旧版曾用其它前缀，这里做一次兜底搬运 */
  var legacy=['wb_check_tasks_v1','inspection_tasks','workbench_tasks'];
  var moved=0;
  legacy.forEach(function(k){
    try{
      var v=localStorage.getItem(k);
      if(v && !localStorage.getItem(K.tasks)){ localStorage.setItem(K.tasks,v); moved++; }
      if(v) localStorage.setItem(K.tasks, localStorage.getItem(K.tasks)||v);
    }catch(e){}
  });
  return moved;
}
migrateFromKeys();

/* ================= 启动 ================= */
loadAll();
/* 旧格式配置自动迁移（幂等） */
var _mig = migrateCfgs();
if(_mig.changed) console.log('电梯配置已迁移 v1/v2 → v3：'+_mig.changed+' 份');
var now=new Date();
STATE.viewDate=new Date(now.getFullYear(),now.getMonth(),1);
renderAll();
syncStart();
</script>
