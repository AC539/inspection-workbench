<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="检验工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="检验工作台">
<meta name="theme-color" content="#007AFF">
<meta name="description" content="特种设备检验日历、排程与电梯配置报告一体化工具">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" type="image/jpeg" href="icon.jpg">
<title>检验工作台 · 配置版</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --txt:#1D1D1F; --sub:#6E6E73; --hint:#AEAEB2; --acc:#007AFF; --accSoft:#E8F1FE;
  --red:#FF3B30; --green:#34C759; --orange:#FF9500; --teal:#00BFA5; --purple:#AF52DE; --gray:#8E8E93;
  --amber:#FF9F0A; --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
input,select,textarea,button{font-family:var(--font);font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:var(--acc);transition:background .15s}
.icon-btn:hover{background:var(--accSoft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;background:var(--acc);color:#fff;transition:opacity .15s;white-space:nowrap}
.btn:active{opacity:.8}
.btn.ghost{background:var(--card);color:var(--acc);border:1px solid var(--line2)}
.btn.sec{background:var(--accSoft);color:var(--acc)}
.btn.danger{background:var(--red)}
.btn.warn{background:var(--amber);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.topbar{position:sticky;top:0;z-index:50;background:rgba(248,248,250,.6);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border-bottom:1px solid rgba(0,0,0,.06)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 16px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.3px;margin-right:auto}
.logo .badge{width:32px;height:32px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.layout{max-width:1200px;margin:0 auto;padding:16px 16px 32px;display:flex;gap:16px;align-items:flex-start}
.cal-wrap{flex:1;min-width:0}
.cal-wrap.hide{display:none}
.side{width:330px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.side.hide{display:none}
.batch-view{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.sec-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav .month{font-size:19px;font-weight:600}
.cal-nav .nav-btns{display:flex;gap:4px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:4px;height:calc(100vh - 180px);min-height:480px}
.cal-dow{text-align:center;font-size:10px;color:var(--sub);padding:2px 0;font-weight:500}
.cal-cell{min-width:0;min-height:0;width:100%;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 3px;cursor:pointer;overflow:hidden;position:relative}
.cal-cell:hover{border-color:var(--line2)}
.cal-cell.blank{background:transparent;border-color:transparent;pointer-events:none}
.cal-cell.other{opacity:.4}
.cal-cell.today{outline:2px solid var(--acc);outline-offset:-1px}
.cal-cell.weekend{background:#FBFBFE}
.cal-num{font-size:15px;color:var(--sub);font-weight:500;margin-bottom:2px;line-height:1.1}
.cal-cell.weekend .cal-num{color:#FF9500}
.cal-cell.today .cal-num{color:var(--acc);font-weight:700}
.cal-tasks{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.cal-task{position:relative;display:block;width:100%;max-width:100%;min-width:0;font-size:10px;line-height:1.35;padding:1px 5px;border-radius:5px;color:inherit;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;box-sizing:border-box;backdrop-filter:blur(12px) saturate(1.6);-webkit-backdrop-filter:blur(12px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 1px 2px rgba(255,255,255,.18)}
.cal-task::before{content:'';position:absolute;left:2px;right:2px;top:1px;height:30%;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.38),transparent);pointer-events:none}
.cal-task::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26%;border-radius:inherit;background:linear-gradient(0deg,rgba(255,255,255,.14),transparent);pointer-events:none}
.cal-task:hover{filter:brightness(1.08)}
.ktag{font-size:8px;background:var(--card);color:inherit;border-radius:2px;padding:0 2px;margin-right:2px;vertical-align:1px;opacity:.85}
.cal-more{position:absolute;right:2px;bottom:2px;background:#FF3B30;color:#fff;border-radius:999px;padding:1px 5px;font-size:9px;line-height:1;font-weight:600;letter-spacing:.2px}
.today-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 16px 0;max-width:1200px;margin-left:auto;margin-right:auto}
@media(max-width:1200px){.today-box{margin-left:16px;margin-right:16px}}
.today-box .sec-title{margin-bottom:4px}
.today-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.today-item.overdue{border-color:#FFD0CE;background:#FFF5F5}
.today-item .t-tag{flex-shrink:0;font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px}
.today-item .t-main{flex:1;min-width:0}
.today-item .t-title{font-size:14px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.today-item .t-sub{font-size:12px;color:var(--sub)}
.empty{padding:22px 0;text-align:center;color:var(--hint);font-size:13px}
/* 侧栏 */
.side-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.side-actions{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:border-color .15s}
.task-item:hover{border-color:var(--line2)}
.task-item .stripe{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.task-item .t-main{flex:1;min-width:0}
.task-item .t-title{font-size:14px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task-item .t-sub{font-size:12px;color:var(--sub);margin-top:1px}
.task-item .t-sub .sep{color:var(--hint);margin:0 4px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.chk.on{background:var(--acc);border-color:var(--acc)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .n{font-size:20px;font-weight:600}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
.group-title{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.3,1)}
@media(min-width:769px){.mask{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
/* 多层级弹窗（当天详情→任务详情→编辑，层层弹出/缩回） */
.sheet-layer{position:fixed;inset:0;pointer-events:none}
.sheet-layer>.mask{display:block;position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .28s;pointer-events:auto}
.sheet-layer.open>.mask{opacity:1}
.sheet-layer>.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;z-index:1;animation:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);pointer-events:auto;max-height:86vh}
.sheet-layer.open>.sheet{transform:translateY(0)}
@media(min-width:769px){.sheet-layer>.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;flex-shrink:0}
.sheet-head .st{font-size:17px;font-weight:600;flex:1;min-width:0}
.sheet-body{padding:18px;overflow-y:auto;overscroll-behavior:contain}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.frow input[type=text],.frow input[type=number],.frow input[type=date],.frow input[type=time],.frow input[type=tel],.frow select,.frow textarea{width:100%;min-height:46px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt);outline:none;transition:border-color .15s}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--acc)}
.frow textarea{min-height:80px;resize:vertical}
.frow .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.frow .hint{font-size:12px;color:var(--hint);margin-top:4px}
.form-actions{display:flex;gap:10px;margin-top:18px}
.form-actions .btn{flex:1}
.dtl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.dtl-item{background:var(--bg);border-radius:12px;padding:10px 12px}
.dtl-item .k{font-size:11px;color:var(--sub);margin-bottom:2px}
.dtl-item .v{font-size:14px;font-weight:500;word-break:break-all}
.dtl-item .v.gray{color:var(--hint);font-weight:400}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0}
.pstripe{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pstripe .bar{width:4px;height:14px;border-radius:2px}
/* 日列表 */
.day-list{display:flex;flex-direction:column;gap:8px}
.day-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.day-time{flex-shrink:0;width:52px;text-align:center;padding-top:2px}
.day-time .hm{font-size:15px;font-weight:600}
.day-time .ampm{font-size:11px;color:var(--hint)}
.day-main{flex:1;min-width:0}
.day-main .tt{font-size:14px;font-weight:500;color:var(--tc)}
.day-main .ts{font-size:12px;color:var(--sub);margin-top:2px}
/* 短信解析预览 */
.sms-text{width:100%;min-height:120px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--card);resize:vertical;outline:none;font-size:15px}
.sms-text:focus{border-color:var(--acc)}
.preview-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--card)}
.preview-card .pv-title{font-size:15px;font-weight:600;margin-bottom:10px}
/* 编排结果 */
.route-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.route-step:last-child{border-bottom:none}
.route-step .idx{width:26px;height:26px;border-radius:50%;background:var(--accSoft);color:var(--acc);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.route-step .rt{flex:1}
.route-step .rt .a{font-size:14px;font-weight:500}
.route-step .rt .b{font-size:12px;color:var(--sub)}
.route-step .tm{font-size:13px;font-weight:600;color:var(--acc);flex-shrink:0;padding-top:4px}
/* 底部导航 */
.bottab{position:fixed;left:0;right:0;bottom:0;z-index:90;display:none;background:rgba(250,250,252,.6);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border-top:1px solid rgba(0,0,0,.07);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottab .bt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;color:var(--hint);font-size:10px}
.bottab .bt.on{color:var(--acc)}
.alertbar{background:#FFF8E6;border:1px solid #F5D28A;color:#7A5B12;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.alertbar.red{background:#FFF0EF;border-color:#FFC9C6;color:#8A1F1A}
.set-group{margin-bottom:22px}
.set-group h4{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:10px}
.color-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.color-row:last-child{border-bottom:none}
.color-row .nm{flex:1;font-size:14px}
.color-row input[type=color]{width:38px;height:34px;border:none;border-radius:8px;background:none;padding:0;cursor:pointer}
.color-row .del{width:36px;height:36px;color:var(--hint);border-radius:8px}
.color-row .del:hover{color:var(--red);background:#FFF0EF}
.type-add{display:flex;gap:8px;margin-top:10px}
.type-add input{flex:1;min-height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;outline:none}
.type-add input:focus{border-color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,122,255,.35)}
@media(max-width:768px){
  .layout{padding:12px 12px 90px;flex-direction:column}
  .side{width:100%;display:none}
  .side.show{display:flex}
  .cal-wrap.hide{display:none}
  .bottab{display:flex}
  .cal-grid{height:calc(100vh - 235px);min-height:360px;gap:3px}
  .cal-cell{padding:2px 3px}
  .cal-task{font-size:8px;line-height:1.2;padding:0 3px;text-overflow:clip;min-width:0}
  .cal-task .ktag{display:none}
  .cal-num{font-size:14px}
  .cal-dow{font-size:9px}
  .fab{display:flex}
  .today-box{margin-left:12px;margin-right:12px}
  .topbar-in{padding:4px 10px}
  .logo{font-size:15px}
  .frow .row2,.frow .row3{grid-template-columns:1fr 1fr}
  .frow .row3{grid-template-columns:1fr}
  .dtl-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  .frow .row2{grid-template-columns:1fr}
}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;font-size:14px;padding:10px 20px;border-radius:999px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
.chk-tag{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none;background:var(--card)}
.chk-tag input{display:none}
.chk-tag.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc);font-weight:500}
.toast.show{opacity:1}
.confirm-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:900;display:none;align-items:center;justify-content:center;padding:24px}
.confirm-mask.show{display:flex}
.confirm-box{background:var(--card);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center}
.confirm-box .ct{font-size:16px;font-weight:600;margin-bottom:8px}
.confirm-box .cd{font-size:14px;color:var(--sub);margin-bottom:18px;line-height:1.6}
.confirm-box .cb{display:flex;gap:10px}
.confirm-box .cb .btn{flex:1}

/* ================= 电梯配置模块 ================= */
.cfg-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:500;background:var(--accSoft);color:var(--acc);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.cfg-chip:hover{filter:brightness(.97)}
.cfg-chip.n{background:var(--bg);color:var(--sub);border-color:var(--line2)}
.cfg-chip.on{background:var(--acc);color:#fff}
.cfg-bar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.cfg-bar::-webkit-scrollbar{height:0}
.cfg-section{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.5px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cfg-section:first-child{margin-top:0}
.cfg-field{margin-bottom:12px}
.cfg-field>label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.cfg-field .hint{font-weight:400;color:var(--hint);font-size:11px;margin-left:6px}
.cfg-field select,.cfg-field input[type=text],.cfg-field input[type=number],.cfg-field textarea{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt);outline:none;font-size:15px;transition:border-color .15s}
.cfg-field select:focus,.cfg-field input:focus,.cfg-field textarea:focus{border-color:var(--acc)}
.cfg-field textarea{min-height:76px;resize:vertical;line-height:1.6}
.cfg-field.unfilled>label{color:var(--red)}
.cfg-field.unfilled select,.cfg-field.unfilled input,.cfg-field.unfilled textarea{border-color:#FFB3AE;background:#FFF7F6}
.cfg-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.cfg-row2{grid-template-columns:1fr}}
.cfg-warn{background:#FFF8E6;border:1px solid #F5D28A;color:#7A5B12;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.75;margin:14px 0}
.cfg-warn b{display:block;font-size:13px;margin-bottom:4px}
/* 对重块独立区 */
.cfg-cwt{background:#F0F7FF;border:1px solid #C9E2FF;border-radius:14px;padding:14px;margin-bottom:6px}
.cfg-cwt .ct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#0A66C2;margin-bottom:10px}
/* 配置卡片列表 */
.cfg-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-left:4px solid var(--acc)}
.cfg-card.c2{border-left-color:var(--purple)}
.cfg-card.c3{border-left-color:var(--teal)}
.cfg-card.c4{border-left-color:var(--orange)}
.cfg-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cfg-card-hd .nm{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-card-hd .cnt{font-size:11px;color:var(--hint);font-weight:500}
.cfg-card-hd .del{width:32px;height:32px;border-radius:9px;color:var(--hint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cfg-card-hd .del:hover{color:var(--red);background:#FFF0EF}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.cfg-grid .it{background:var(--bg);border-radius:10px;padding:7px 10px;min-width:0}
.cfg-grid .it .k{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-grid .it .v{font-size:13px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-grid .it .v.gray{color:var(--hint);font-weight:400}
.cfg-card .btn-report,.cfg-card .btn{position:relative;z-index:2}
.cfg-empty{text-align:center;padding:34px 20px;color:var(--hint)}
.cfg-empty svg{opacity:.35;margin-bottom:10px}
/* 详情页头部操作条 */
.cfg-hero{background:linear-gradient(135deg,#007AFF,#5AC8FA);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.cfg-hero .h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.cfg-hero .h2{font-size:13px;opacity:.92;margin-top:6px;line-height:1.6}
.cfg-hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cfg-hero .acts .btn{background:rgba(255,255,255,.95);color:var(--acc)}
.cfg-hero .acts .btn.alt{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.45)}
.cfg-hero .acts .btn.wide{flex:1;min-width:130px}
/* 生成报告按钮 —— 显眼位置 */
.btn-report{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FF9500,#FF6A00);box-shadow:0 6px 18px rgba(255,106,0,.32);letter-spacing:.5px}
.btn-report:active{opacity:.85;transform:scale(.99)}
.btn-report.blue{background:linear-gradient(135deg,#007AFF,#0A84FF);box-shadow:0 6px 18px rgba(0,122,255,.3)}
.btn-report.green{background:linear-gradient(135deg,#34C759,#00B36B);box-shadow:0 6px 18px rgba(52,199,89,.3)}
/* 报告预览容器 */
/* ===== 报告全屏视图 ===== */
.rpt-view{position:fixed;inset:0;z-index:800;background:var(--bg);display:none;flex-direction:column}
.rpt-view.show{display:flex;animation:rpIn .2s ease}
@keyframes rpIn{from{opacity:0}to{opacity:1}}
.rp-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(248,248,250,.86);
  backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
  border-bottom:1px solid rgba(0,0,0,.07);padding-top:calc(10px + env(safe-area-inset-top))}
.rp-head-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.rp-back{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 14px;border-radius:11px;
  background:var(--card);border:1px solid var(--line2);color:var(--acc);font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0}
.rp-back:active{opacity:.75}
.rp-title{font-size:16px;font-weight:600;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-head-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rp-pages{font-size:11px;color:var(--hint);margin-right:2px;white-space:nowrap}
.rp-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:11px;
  font-size:14px;font-weight:500;white-space:nowrap}
.rp-btn.ghost{background:var(--card);color:var(--acc);border:1px solid var(--line2)}
.rp-btn.primary{background:var(--acc);color:#fff}
.rp-btn:active{opacity:.8}
.rpt-meta{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin:12px 16px 0;font-size:12px;line-height:1.8}
.rpt-alert{flex-shrink:0;background:#FFF8E6;border:1px solid #F5D28A;border-radius:14px;padding:12px 14px;margin:12px 16px 0}
.rpt-alert-hd{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#7A5B12;margin-bottom:8px}
.rpt-alert-it{font-size:12px;color:#7A5B12;line-height:1.75;padding:7px 0;border-top:1px solid rgba(245,210,138,.7)}
.rpt-alert-it:first-of-type{border-top:none}
.rpt-alert-it b{color:#5A4208}
/* 报告滚动区：占满剩余高度 */
.rpt-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#E5E5E5;padding:14px 8px calc(28px + env(safe-area-inset-bottom))}
.rpt-fit{width:794px}
@media(max-width:768px){
  .rp-head{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px}
  .rp-head-l{flex:1;min-width:0}
  .rp-title{font-size:13px;line-height:1.3}
  .rp-back{padding:0 11px;font-size:13px}
  .rp-pages{display:none}
  .rp-btn{padding:0 12px;font-size:13px;min-height:38px}
  /* 打印按钮在手机上只留图标，避免挤压标题 */
  .rp-btn.primary span{display:none}
  .rpt-meta,.rpt-alert{margin:10px 10px 0}
  .rpt-scroll{padding:10px 4px calc(24px + env(safe-area-inset-bottom))}
}
.rpt-scroll .page{margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.16);transform-origin:top left}
@media print{
  body *{visibility:hidden}
  #rptView,#rptView *{visibility:visible}
  #rptView{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
  .rp-head,.rpt-alert,.rpt-meta,.rp-back{display:none!important}
  .rpt-scroll{overflow:visible;background:#fff;padding:0;height:auto;overflow:visible}
  /* 打印恢复 1:1 原始 A4 尺寸，忽略屏幕上的放大缩放 */
  .rpt-fit{transform:none!important;width:auto!important;margin:0!important}
  .rpt-scroll .page{margin:0!important;box-shadow:none;page-break-after:always}
  .rpt-scroll .page:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
/* 保存条：不用 sticky，避免遮挡下方内容；改为普通块 + 顶部描边 */
.cfg-sticky{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cfg-sticky .form-actions{margin:0}


/* ===== 报告 A4 版式（源自电梯报告生成器） ===== */
/* A4 Page Setup */
.page {
  width: 210mm;
  min-height: 297mm;
  padding: 18mm 16mm;
  margin: 0 auto 14px;
  background: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
  position: relative;
  font-size: 12px;
  color: #000;
}
.page-header {
  position: absolute; top: 6mm; left: 16mm;
  font-size: 10px; color: #666;
}
.page-footer {
  position: absolute; bottom: 8mm; left: 0; right: 0;
  text-align: center; font-size: 10px; color: #333;
}

/* Cover Page */
.cover-info {
  position: absolute; top: 16mm; right: 16mm;
  text-align: left; font-size: 11px;
  line-height: 1.8;
}
.cover-info .row { display: flex; gap: 8px; }
.cover-info .lbl { width: 70px; color: #333; }
.cover-info .val { min-width: 120px; border-bottom: 1px solid #999; }
.cover-title {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  margin-top: 38mm;
  letter-spacing: 4px;
}
.cover-subtitle {
  text-align: center;
  font-size: 14px;
  margin-top: 6mm;
  letter-spacing: 2px;
}
.cover-form {
  margin-top: 32mm;
  font-size: 13px;
}
.cover-form .row {
  display: flex; align-items: baseline;
  margin-bottom: 8mm;
  padding-left: 30mm;
}
.cover-form .lbl {
  width: 100px;
  letter-spacing: 2px;
  font-weight: 500;
}
.cover-form .val {
  flex: 1;
  border-bottom: 1px solid #000;
  padding-bottom: 1px;
  min-height: 18px;
}

/* Page 4: Information table */
.info-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 6mm;
}
.info-table th, .info-table td {
  border: 1px solid #000;
  padding: 4px 6px;
  vertical-align: middle;
  text-align: center;
  height: 22px;
}
.info-table .lbl { background: #fff; width: 18%; }
.info-table .val { text-align: left; padding-left: 8px; width: 32%; }
.info-title {
  text-align: center; font-size: 18px; font-weight: 700;
  margin-bottom: 4mm;
}
.remark-row td {
  height: 80px;
  text-align: left;
  vertical-align: top;
  padding: 6px 8px;
  line-height: 1.7;
}
.placeholder-large {
  font-size: 28px; font-weight: 700;
  text-align: center; margin-top: 100mm;
  color: #999;
  letter-spacing: 20px;
}

/* Page 5-11: Inspection items table */
.items-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
  margin-top: 4mm;
}
.items-table th, .items-table td {
  border: 1px solid #000;
  padding: 4px 5px;
  vertical-align: top;
}
.items-table th {
  text-align: center;
  font-weight: 500;
  background: #f5f5f5;
  height: 22px;
}
.items-table .col-no { width: 5%; text-align: center; }
.items-table .col-code { width: 13%; text-align: center; }
.items-table .col-name { width: 14%; text-align: center; }
.items-table .col-content { width: 50%; }
.items-table .col-result { width: 8%; text-align: center; font-weight: 700; font-size: 13px; }
.items-table .col-note { width: 10%; text-align: center; }
.section-header { display: block; font-weight: 700; text-align: center; background: #eef2ff; padding: 2px 6px; margin-bottom: 2px; border-radius: 2px; font-size: 11px; }

.items-table td .sub {
  display: block;
  margin-bottom: 4px;
  line-height: 1.5;
}
.items-table td .sub:last-child { margin-bottom: 0; }

/* Page 11 footer: Notes */
.notes {
  margin-top: 6mm;
  font-size: 11px;
  line-height: 1.7;
  padding: 4mm 0;
}
.notes p { margin-bottom: 4px; text-indent: 0; }
.notes .note-title { font-weight: 700; }

/* Appendix tables */
.appendix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-top: 2mm;
}
.appendix-table th, .appendix-table td {
  border: 1px solid #000;
  padding: 4px 6px;
  text-align: center;
  height: 22px;
}
.appendix-table th {
  background: #f5f5f5;
  font-weight: 500;
}
.appendix-title {
  font-size: 13px;
  font-weight: 500;
  margin-top: 6mm;
  margin-bottom: 1mm;
}
.appendix-subtitle {
  font-size: 10px;
  margin-bottom: 1mm;
}
.appendix-unit {
  text-align: right;
  font-size: 10px;
  margin-bottom: 1mm;
}

/* Page instructions */
.instructions {
  font-size: 12px;
  line-height: 1.8;
  margin-top: 6mm;
}
.instructions h2 {
  text-align: center; font-size: 18px; font-weight: 700;
  margin-bottom: 10mm;
}
.instructions ol { list-style: none; padding-left: 0; }
.instructions ol li {
  margin-bottom: 6px;
  text-indent: 0;
}

/* Print */
@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .page {
    margin: 0;
    box-shadow: none;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }
  @page {
    size: A4;
    margin: 0;
  }
}

.fill-blank {
  display: inline-block;
  min-width: 60px;
  border-bottom: 1px solid #000;
  text-align: center;
  font-weight: 700;
}
.parsed-display {
  background: #f0f5ff; padding: 6px 10px; border-radius: 4px;
  font-size: 12px; margin-top: 6px;
  display: inline-block;
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-in">
    <div class="logo">
      <div class="badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div>
      检验工作台
    </div>
    <button class="icon-btn" title="上传到云端" onclick="uploadCloud()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 16a4 4 0 0 0 0-8 6 6 0 0 0-11.4 1.6A3.5 3.5 0 0 0 7 17h4"/><path d="M12 12V5m0 0L9 8m3-3l3 3"/></svg></button>
    <button class="icon-btn" title="从云端下载合并" onclick="downloadCloud()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 16a4 4 0 0 0 0-8 6 6 0 0 0-11.4 1.6A3.5 3.5 0 0 0 7 17h4"/><path d="M12 12v7m0 0l-3-3m3 3l3-3"/></svg></button>
    <button class="icon-btn" title="手机/电脑数据互通" onclick="openTransfer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12M16 4l3 3-3 3M20 17H8M8 14l-3 3 3 3"/></svg></button>
    <button class="icon-btn" title="设置" onclick="openSettings()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg></button>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
</header>

<!-- 数据量提醒 -->
<div class="today-box" id="alertBoxWrap" style="display:none"></div>

<!-- 主布局 -->
<div class="layout">
  <div class="cal-wrap" id="calWrap">
    <div class="section">
      <div class="cal-nav">
        <button class="icon-btn" onclick="shiftMonth(-1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="month" id="monthLabel">2026年8月</div>
        <div class="nav-btns">
          <button class="btn ghost sm" onclick="goToday()">今天</button>
          <button class="icon-btn" onclick="shiftMonth(1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 右侧栏 -->
  <aside class="side" id="sidePanel">
    <div class="side-card">
      <div class="sec-title"><span>待安排任务</span><span style="font-size:12px;color:var(--hint);font-weight:400" id="pendCount"></span></div>
      <div class="side-actions">
        <button class="btn" onclick="openSmsImport()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>报检短信导入</button>
        <button class="btn sec" onclick="showRouteView()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6"/></svg>顺路编排</button>
        <button class="btn ghost" onclick="showBatchView()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>批量改阶段</button>
      </div>
      <div id="pendList" style="margin-top:4px"></div>
    </div>
    <div class="side-card">
      <div class="sec-title">阶段分布</div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>
    <div class="side-card">
      <div class="sec-title">自定义说明</div>
      <div style="font-size:13px;color:var(--sub);line-height:1.8">
        任务块左侧色条 = 报告阶段；标题字体颜色 = 设备类别。<br>
        颜色均可到设置中自定义。
      </div>
    </div>
  </aside>

  <!-- 批量阶段独立界面 -->
  <div class="batch-view" id="batchView" style="display:none">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
      <button class="icon-btn" onclick="closeBatchView()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:17px;font-weight:600">批量更改阶段</span>
      <span style="font-size:12px;color:var(--hint);margin-left:auto" id="batchCount"></span>
    </div>
    <div id="batchBody"></div>
    <div style="position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 0 0;margin-top:6px">
      <select id="bs_stage" style="flex:1;min-height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--card);font-size:15px"></select>
      <button class="btn" onclick="applyBatchView()" id="bs_apply">应用</button>
    </div>
  </div>

  <!-- 顺路编排独立界面 -->
  <div class="batch-view" id="routeView" style="display:none">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
      <button class="icon-btn" onclick="closeRouteView()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span style="font-size:17px;font-weight:600">顺路编排</span>
      <span style="font-size:12px;color:var(--hint);margin-left:auto" id="routeCount"></span>
    </div>
    <div id="routeBody"></div>
    <div id="routeResult"></div>
    <div style="position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 0 0;margin-top:12px">
      <button class="btn" style="flex:1" onclick="planSelectedRoute()" id="routePlanBtn">开始智能排序</button>
      <button class="btn sec" onclick="exportSelectedExcel()">导出Excel</button>
      <button class="btn ghost" onclick="refreshRoute()">重置</button>
    </div>
  </div>
</div>

<!-- 浮动添加按钮 -->
<button class="fab" onclick="openTaskForm()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- 底部导航 -->
<nav class="bottab">
  <button class="bt on" id="tabCal" onclick="switchTab('cal')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>日历</button>
  <button class="bt" id="tabTask" onclick="switchTab('task')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>待安排</button>
  <button class="bt" id="tabBatch" onclick="switchTab('batch')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></svg>批量阶段</button>
</nav>

<!-- 通用弹层 -->
<div class="mask" id="mask">
  <div class="sheet">

<script>
/* ================= 存储层 ================= */
var P = 'wb_check_';
var K = {tasks:P+'tasks', types:P+'deviceTypes', cols:P+'statusColors', set:P+'settings', seeded:P+'seeded'};
var DEFAULT_TYPES = {
  '电梯定期检验':'#007AFF',
  '电梯监督检验':'#5AC8FA',
  '叉车定期检验':'#FF9500',
  '起重机定期检验':'#AF52DE'
};
var DEFAULT_COLS = {
  pending:'#8E8E93', scheduled:'#007AFF', done:'#34C759',
  report_received:'#00BFA5', report_review:'#FF9F0A', report_archived:'#AF52DE'
};
var DEFAULT_SETTINGS = {
  startDistrict:'青羊区', speedKmh:25, taskMinutes:90, startTime:'09:00',
  useMap:false, mapKey:'', syncUrl:'', syncToken:'', ghToken:'', ghRepo:'AC539/inspection-workbench'
};
var STATUS = {
  pending:'待安排', scheduled:'已排期', done:'检验完成',
  report_received:'报告·收到单子', report_review:'报告·校核中', report_archived:'报告·归档完成'
};
var STATE = {tasks:[], types:{}, cols:{}, set:{}, viewDate:null, selDate:null, batch:false, batchSel:{}, editingId:null, smsPreview:null, routePlan:null, deletedIds:[]};

function loadAll(){
  STATE.types = JSON.parse(localStorage.getItem(K.types)||'null') || Object.assign({}, DEFAULT_TYPES);
  STATE.cols = JSON.parse(localStorage.getItem(K.cols)||'null') || Object.assign({}, DEFAULT_COLS);
  STATE.set = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(K.set)||'{}'));
  STATE.tasks = JSON.parse(localStorage.getItem(K.tasks)||'[]');
  // 数据修正：非待安排但没有排期日期的任务，自动归类回待安排
  STATE.tasks.forEach(function(t){
    if(t.status!=='pending'&&!t.date) t.status='pending';
  });
  if(!localStorage.getItem(K.seeded)){
    seedDemo();
    localStorage.setItem(K.seeded,'1');
  }
}
function saveAll(){
  STATE.tasks.forEach(function(t){
    if(!t.updatedAt) t.updatedAt=Date.now();
    // 阶段统一规则：安排了排期时间的任务，阶段必须是「已排期」（完成态任务不受影响）
    if(t.date&&t.status==='pending') t.status='scheduled';
    // 没有排期时间的非待安排任务，自动回到待安排
    if(t.status!=='pending'&&!t.date) t.status='pending';
  });
  localStorage.setItem(K.tasks, JSON.stringify(STATE.tasks));
  localStorage.setItem(K.types, JSON.stringify(STATE.types));
  localStorage.setItem(K.cols, JSON.stringify(STATE.cols));
  localStorage.setItem(K.set, JSON.stringify(STATE.set));
  syncPush();
}
function uid(){return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);}

/* ================= 多人同步（服务器模式） ================= */
var SYNC = {url:'', version:0, timer:null, pulling:false, lastOk:0};
function syncUrl(){ return (STATE.set&&STATE.set.syncUrl||'').replace(/\/+$/,''); }
/* 字段级互补合并：同任务 id 时，较新的为主体，主体缺失的字段用较旧的补全 */
function mergeTaskObj(a,b){
  var newer=(b.updatedAt||0)>=(a.updatedAt||0)?b:a;
  var older=newer===b?a:b;
  var out={};
  var clearedAll=(a._cleared||[]).concat(b._cleared||[]);
  Object.keys(newer).forEach(function(k){ out[k]=newer[k]; });
  Object.keys(older).forEach(function(k){
    if(k==='_cleared') return;
    var v=older[k];
    if(v==null||v===''||(Array.isArray(v)&&!v.length)) return;
    var ov=out[k];
    if(ov==null||ov===''||(Array.isArray(ov)&&!ov.length)){
      if(clearedAll.indexOf(k)>=0) return; // 该字段曾被主动清空（如取消安排），不再用旧数据补回
      out[k]=v;
    }
  });
  if(clearedAll.length) out._cleared=Array.from(new Set(clearedAll));
  return out;
}
function syncHeaders(){
  var t=(STATE.set&&STATE.set.syncToken||'').trim();
  return t?{'X-Token':t}:{};
}
function syncStatus(msg,ok){
  var el=document.getElementById('syncStatus');
  if(el) el.innerHTML=msg;
  if(ok) SYNC.lastOk=Date.now();
}
function syncStart(){
  if(SYNC.timer){ clearInterval(SYNC.timer); SYNC.timer=null; }
  var u=syncUrl();
  if(!u){ syncStatus('未启用多人同步',false); return; }
  SYNC.url=u;
  syncPull();
  SYNC.timer=setInterval(syncPoll,5000);
}
function syncPull(){
  var u=syncUrl(); if(!u||SYNC.pulling) return;
  SYNC.pulling=true;
  fetch(u+'/api/data',{headers:syncHeaders()}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.tasks){
      var merged=[];
      var byId={};
      STATE.tasks.forEach(function(t){ if(t.id&&STATE.deletedIds.indexOf(t.id)<0) byId[t.id]=t; });
      (d.tasks||[]).forEach(function(t){
        if(!t.id||STATE.deletedIds.indexOf(t.id)>=0) return;
        if(byId[t.id]){
          byId[t.id]=mergeTaskObj(byId[t.id],t);
        }else{ byId[t.id]=t; }
      });
      merged=Object.keys(byId).map(function(k){return byId[k];});
      STATE.tasks=merged;
      if(d.types) STATE.types=Object.assign({},DEFAULT_TYPES,d.types);
      if(d.cols) STATE.cols=Object.assign({},DEFAULT_COLS,d.cols);
      if(d.settings) STATE.set=Object.assign({},DEFAULT_SETTINGS,STATE.set,d.settings);
      SYNC.version=d.version||0;
      saveAllLocal();
      renderAll();
      syncStatus('<span style="color:var(--green)">已连接服务器 · 共 '+merged.length+' 条任务 · 版本 '+SYNC.version+'</span>',true);
    }else{
      syncStatus('<span style="color:var(--red)">连接失败：服务器返回异常</span>',false);
    }
  }).catch(function(){
    syncStatus('<span style="color:var(--red)">未连接服务器（检查地址/网络）</span>',false);
  }).then(function(){ SYNC.pulling=false; });
}
function saveAllLocal(){
  localStorage.setItem(K.tasks, JSON.stringify(STATE.tasks));
  localStorage.setItem(K.types, JSON.stringify(STATE.types));
  localStorage.setItem(K.cols, JSON.stringify(STATE.cols));
  localStorage.setItem(K.set, JSON.stringify(STATE.set));
}
function syncPoll(){
  var u=syncUrl(); if(!u||SYNC.pulling) return;
  fetch(u+'/api/poll',{headers:syncHeaders()}).then(function(r){return r.json();}).then(function(d){
    if(d.version!==SYNC.version) syncPull();
  }).catch(function(){});
}
function syncPush(){
  var u=syncUrl(); if(!u) return;
  var deleted=STATE.deletedIds.slice();
  fetch(u+'/api/data',{
    method:'POST',
    headers:Object.assign({'Content-Type':'application/json'},syncHeaders()),
    body:JSON.stringify({tasks:STATE.tasks,types:STATE.types,cols:STATE.cols,settings:STATE.set,deleted:deleted})
  }).then(function(r){return r.json();}).then(function(d){
    if(d&&d.version){
      SYNC.version=d.version;
      var byId={};
      STATE.tasks.forEach(function(t){ if(t.id) byId[t.id]=t; });
      (d.tasks||[]).forEach(function(t){ if(t.id) byId[t.id]=byId[t.id]?mergeTaskObj(byId[t.id],t):t; });
      STATE.tasks=Object.keys(byId).map(function(k){return byId[k];});
      if(deleted.length) STATE.deletedIds=STATE.deletedIds.filter(function(x){return deleted.indexOf(x)<0;});
      saveAllLocal();
      renderAll();
      syncStatus('<span style="color:var(--green)">已同步到服务器 · 版本 '+SYNC.version+'</span>',true);
    }
  }).catch(function(){ syncStatus('<span style="color:var(--red)">同步失败（离线或服务器不可达）</span>',false); });
}

/* ================= GitHub 云端同步（按需上传/下载） ================= */
function ghStatus(msg,ok){
  var el=document.getElementById('ghStatus');
  if(el) el.innerHTML=msg;
}
function ghApi(method, path, body){
  var token=(STATE.set&&STATE.set.ghToken||'').trim();
  if(!token) return Promise.reject(new Error('请先填写 GitHub Token'));
  var opts={method:method, headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}};
  if(body!==undefined){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  return fetch('https://api.github.com'+path, opts).then(function(r){
    if(r.status===404) return null;
    if(!r.ok) return r.json().then(function(d){ throw new Error('GitHub '+r.status+(d&&d.message?': '+d.message:'')); });
    return r.json();
  });
}
function ghCreds(){
  var elT=document.getElementById('setGhToken'), elR=document.getElementById('setGhRepo');
  var token=elT?elT.value.trim():'';
  var repo=elR?elR.value.trim():'';
  if(!token) token=(STATE.set&&STATE.set.ghToken||'').trim();
  if(!repo) repo=(STATE.set&&STATE.set.ghRepo||'').trim();
  return {token:token, repo:repo};
}
function uploadCloud(){
  var c=ghCreds();
  var token=c.token, repo=c.repo;
  if(!token||!repo){ ghStatus('<span style="color:var(--red)">请先在设置里填写 Token 和仓库名</span>'); toast('请先在设置里配置 GitHub 同步'); return; }
  STATE.set.ghToken=token; STATE.set.ghRepo=repo;
  localStorage.setItem(K.set, JSON.stringify(STATE.set));
  ghStatus('<span style="color:var(--sub)">正在上传到云端…</span>');
  var payload={v:1, updatedAt:Date.now(), tasks:STATE.tasks, types:STATE.types, cols:STATE.cols};
  var b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  ghApi('GET','/repos/'+repo+'/contents/data.json').then(function(existing){
    var body={message:'工作台云端同步上传', content:b64, branch:'main'};
    if(existing&&existing.sha) body.sha=existing.sha;
    return ghApi('PUT','/repos/'+repo+'/contents/data.json', body);
  }).then(function(){
    ghStatus('<span style="color:var(--green)">已上传 '+STATE.tasks.length+' 条任务到云端 ✓</span>');
    toast('已上传到云端');
  }).catch(function(e){
    ghStatus('<span style="color:var(--red)">上传失败：'+esc(e.message||e)+'</span>');
  });
}
function downloadCloud(){
  var c=ghCreds();
  var token=c.token, repo=c.repo;
  if(!token||!repo){ ghStatus('<span style="color:var(--red)">请先在设置里填写 Token 和仓库名</span>'); toast('请先在设置里配置 GitHub 同步'); return; }
  STATE.set.ghToken=token; STATE.set.ghRepo=repo;
  localStorage.setItem(K.set, JSON.stringify(STATE.set));
  ghStatus('<span style="color:var(--sub)">正在从云端下载…</span>');
  ghApi('GET','/repos/'+repo+'/contents/data.json').then(function(f){
    if(!f||!f.content){ throw new Error('云端还没有数据（先在一台设备点「上传到云端」）'); }
    var raw=f.content.replace(/\n/g,'');
    var s=decodeURIComponent(escape(atob(raw)));
    var d=JSON.parse(s);
    if(!d||!Array.isArray(d.tasks)) throw new Error('云端数据格式异常');
    var r=mergeIncoming(d);
    ghStatus('<span style="color:var(--green)">下载完成：新增 '+r.add+' 条，更新 '+r.upd+' 条，共 '+STATE.tasks.length+' 条 ✓</span>');
    toast('已从云端合并数据');
  }).catch(function(e){
    ghStatus('<span style="color:var(--red)">下载失败：'+esc(e.message||e)+'</span>');
  });
}

/* ================= 工具 ================= */
function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){var d=new Date();return fmtDate(d);}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2200);}
function addMinutes(timeStr,min){var p=(timeStr||'09:00').split(':');var d=new Date(2020,0,1,+p[0],+p[1]+min);return pad(d.getHours())+':'+pad(d.getMinutes());}

}
function statusColor(st){return STATE.cols[st]||'#8E8E93';}
function hexA(hex,a){
  var h=String(hex||'').replace('#','');
  if(h.length===3) h=h.split('').map(function(c){return c+c;}).join('');
  if(h.length!==6) return 'rgba(0,0,0,'+a+')';
  var n=parseInt(h,16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function fgOn(hex){
  var h=String(hex||'').replace('#','');
  if(h.length===3) h=h.split('').map(function(c){return c+c;}).join('');
  if(h.length!==6) return '#FFFFFF';
  var n=parseInt(h,16);
  var r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  var lin=0.299*r+0.587*g+0.114*b;
  return lin>0.65?'#1D1D1F':'#FFFFFF';
}

function resolveLoc(address){
  if(!address) return null;
  var keys=Object.keys(DISTRICTS);
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(address.indexOf(k)>=0){
      var c=DISTRICTS[k];
      return {lat:c.lat,lng:c.lng,district:k};
    }
  }
  return null;
}
function haversine(lat1,lng1,lat2,lng2){
  var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function driveMin(a,b){
  if(!a||!b) return 99;
  var sp=STATE.set.speedKmh||25;
  if(a.district&&a.district===b.district){
    return Math.max(3, Math.round(3/(sp/60)));
  }
  if(a.lat==null||a.lng==null||b.lat==null||b.lng==null) return 20;
  var km=haversine(a.lat,a.lng,b.lat,b.lng)*1.4;
  return Math.max(1, Math.round(km/(sp/60)));
}

/* ================= 报检短信解析 ================= */
function extractCompany(t){
  var m=t.match(/来自\s*([\s\S]*?)(?:申报|的)/);
  if(!m) return '';
  var s=m[1].trim();
  var m2=s.match(/^([\u4e00-\u9fa5A-Za-z0-9（）()]+?(?:公司|集团|厂|中心|站|部|院|所|学校))/);
  if(m2) return m2[1];
  return s.split(/\s+/)[0]||'';
}
function parseSms(text){
  var t=text||'', r={company:'',reportNo:'',count:1,address:'',contact:'',phone:'',nextDate:'',deviceType:'',inspectType:'定期检验',projectName:'',maintCo:'',area:''};
  var m;
  r.company=extractCompany(t);
  m=t.match(/报检单号(?:为)?\s*([A-Za-z0-9]+)/); if(m) r.reportNo=m[1];
  m=t.match(/报检设备数量\s*(\d+)\s*台/); if(m) r.count=+m[1];
  m=t.match(/项目地址(?:为)?[:：]?\s*([^\s，。,；;]+)/); if(m) r.address=m[1];
  m=t.match(/申请联系人员?为?\s*([\u4e00-\u9fa5]{2,4})/); if(m) r.contact=m[1];
  m=t.match(/下次检验日期\s*[（(]?\s*(\d{4}-\d{2}-\d{2})/); if(m) r.nextDate=m[1];
  m=t.match(/[（(](电梯|叉车|起重机|场[厂（(]?车|锅炉|压力容器|机械式停车设备)[)）]/); var dev=m?m[1]:'';
  m=t.match(/(安装监督检验|监督检验|定期检验|委托检验)/); if(m) r.inspectType=m[1];
  m=t.match(/(?:设备所属区域|设备所在区域|所属区域|区域)[:：]?\s*([\u4e00-\u9fa5]{2,10}(?:市|区|县))/); if(m) r.area=m[1];
  if(dev) r.deviceType=matchDeviceType(normDevice(dev),normInspect(r.inspectType));
  if(!r.area&&r.address) r.area=guessArea(r.address);
  if(!r.contact){ m=t.match(/(?:检验现场联系人|现场联系人|联系人)[:：为]?\s*([\u4e00-\u9fa5]{2,4})/); if(m) r.contact=m[1]; }
  if(!r.phone){ m=t.match(/(?:检验现场联系电话|联系电话|手机)[:：为]?\s*(1[3-9]\d{9})/); if(m) r.phone=m[1]; }
  return r;
}
/* 综合检验系统「键值对」格式解析（复制自系统页面）
   兼容两种排版：①标签与值同一行「使用单位：成都XX」②标签独占一行、值在下一行
   关键修正：值为空时（下一行是另一个标签），不能把下一行的标签名当成值 */
var FORM_KEYS=['报检单号','检验现场联系电话','施工单位联系人','施工联系人电话','申请联系电话','联系人电话',
  '检验现场联系人','使用单位备注','设备所属区域','设备所在区域','设备所在地址','设备地址','设备数量',
  '设备类型','设备类别','设备品种','检验类型','检验类别','检验性质','使用单位','申请单位','单位名称',
  '项目名称','工程名称','维保单位','维护保养单位','制造单位','施工单位','联系人','申请人','施工类别',
  '地铁线路','BRT线路','高铁线路','登记机关','所属区域','所在区域'];
function fieldValue(t,key){ /* 旧版单行取值，保留兼容 */
  var re=new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:：]\\s*\\n?\\s*([^\\n\\t]+)');
  var m=t.match(re);
  return m?m[1].trim():'';
}
function splitLabel(line){
  var m=String(line||'').match(/^([^:：]{1,40})\s*[:：]\s*([\s\S]*)$/);
  if(!m) return null;
  var k=m[1].trim();
  if(k.length<2) return null;
  if(!/[\u4e00-\u9fa5A-Za-z]/.test(k)) return null;   /* 排除 09:00 这类时间值 */
  return {key:k, val:m[2].trim()};
}
/* 逐行切分「标签：值」，标签行的值为空时不会吃掉下一行的标签 */
function parseFormFields(text){
  var lines=String(text||'').replace(/\r/g,'').split('\n').map(function(s){return s.trim();});
  var out={};
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    if(!L) continue;
    var a=splitLabel(L);
    if(!a) continue;
    var val=a.val;
    if(val===''){
      var j=i+1;
      while(j<lines.length&&!lines[j]) j++;
      if(j<lines.length){
        var nb=splitLabel(lines[j]);
        var nbIsLabel = nb && (nb.val==='' || FORM_KEYS.indexOf(nb.key)>=0);
        if(!nbIsLabel){ val=lines[j]; i=j; }   /* 下一行不是标签 → 就是本字段的值 */
      }
    }
    if(out[a.key]===undefined) out[a.key]=val;
  }
  return out;
}
function fPick(f,keys){
  for(var i=0;i<keys.length;i++){ var v=f[keys[i]]; if(v) return String(v).trim(); }
  return '';
}
/* 设备类型归一化：系统写「起重机械」，软件类别叫「起重机定期检验」 */
var DEV_NORM=[
  [/起重|吊车|吊机/, '起重机'],
  [/叉车|场[（(]?厂[)）]?内|机动工业车辆|观光车/, '叉车'],
  [/电梯|扶梯|自动人行道|升降机/, '电梯'],
  [/锅炉/, '锅炉'],
  [/气瓶|压力容器/, '压力容器'],
  [/管道/, '压力管道'],
  [/游乐/, '大型游乐设施'],
  [/索道/, '客运索道'],
  [/停车/, '机械式停车设备']
];
function normDevice(dev){
  var s=String(dev||'').trim();
  if(!s) return '';
  for(var i=0;i<DEV_NORM.length;i++) if(DEV_NORM[i][0].test(s)) return DEV_NORM[i][1];
  return s;
}
function normInspect(s){
  s=String(s||'').trim();
  if(!s) return '定期检验';
  if(/安装/.test(s)&&/监督/.test(s)) return '安装监督检验';
  if(/监督/.test(s)) return '监督检验';
  if(/定期/.test(s)) return '定期检验';
  if(/委托/.test(s)) return '委托检验';
  return s;
}
/* 归一化后的「起重机+定期检验」去匹配已有类别名，命中「起重机定期检验」→ 颜色/识别都对 */
function matchDeviceType(base,it){
  if(!base) return '';
  var keys=Object.keys(STATE.types||{});
  var want=base+it;
  if(keys.indexOf(want)>=0) return want;
  for(var i=0;i<keys.length;i++){
    if(keys[i].indexOf(base)===0&&keys[i].indexOf(it)>=0) return keys[i];
  }
  return want;
}
/* 从地址串里识别成都区县名 */
function guessArea(addr){
  if(!addr) return '';
  var keys=Object.keys(DISTRICTS||{});
  for(var i=0;i<keys.length;i++) if(String(addr).indexOf(keys[i])>=0) return keys[i];
  return '';
}
function parseFormData(text){
  var f=parseFormFields(text);
  var r={company:'',reportNo:'',count:'',address:'',contact:'',phone:'',nextDate:'',deviceType:'',
    inspectType:'',projectName:'',maintCo:'',area:'',raw:f};
  r.reportNo=fPick(f,['报检单号','检验单号','单号']);
  var devTop=fPick(f,['设备类型','设备类别','设备品种']);
  r.inspectType=normInspect(fPick(f,['检验类型','检验类别','检验性质']));
  r.company=fPick(f,['使用单位','申请单位','单位名称']);
  r.projectName=fPick(f,['项目名称','工程名称']);
  r.maintCo=fPick(f,['维保单位','维护保养单位']);
  r.area=fPick(f,['设备所属区域','设备所在区域','所属区域','设备区域','所在区域','区县']);
  r.address=fPick(f,['设备所在地址','设备地址','项目地址','使用地址','安装地址','地址']);
  r.contact=fPick(f,['检验现场联系人','现场联系人','联系人','申请人','使用单位联系人']);
  r.phone=fPick(f,['检验现场联系电话','现场联系电话','联系人电话','申请联系电话','联系电话','手机号','电话']);
  var cnt=fPick(f,['设备数量','报检设备数量','数量','台数']);
  if(cnt) r.count=String(cnt).replace(/[^0-9]/g,'')||'';
  if(!r.area&&r.address) r.area=guessArea(r.address);
  r.deviceType=matchDeviceType(normDevice(devTop),r.inspectType);
  return r;
}
function detectForm(text){
  return /报检单号\s*[:：]/.test(text)&&/使用单位\s*[:：]/.test(text);
}

function renderCalendar(){
  var grid=document.getElementById('calGrid');
  var y=STATE.viewDate.getFullYear(),mo=STATE.viewDate.getMonth();
  var first=new Date(y,mo,1);
  var dim=new Date(y,mo+1,0).getDate();
  var prevDim=new Date(y,mo,0).getDate();
  var isMobile=window.matchMedia&&window.matchMedia('(max-width:768px)').matches;
  function calLabel(t){
    var s=taskTitle(t);
    if(isMobile) return Array.from(s).slice(0,4).join('')+'..';
    return s;
  }
  var byDate={};
  STATE.tasks.forEach(function(t){
    if(!t.date) return;
    var ed=t.endDate||t.date;
    var dd=parseDate(t.date), de=parseDate(ed);
    var days=Math.min(Math.round((de-dd)/86400000)+1, 31);
    for(var k=0;k<days;k++){
      var ds=fmtDate(new Date(dd.getFullYear(),dd.getMonth(),dd.getDate()+k));
      (byDate[ds]=byDate[ds]||[]).push(t);
    }
  });
  var today=todayStr();
  var html='';
  ['日','一','二','三','四','五','六'].forEach(function(w){ html+='<div class="cal-dow">'+w+'</div>'; });
  var cells=[];
  var leadAll=first.getDay();
  var leadShow=Math.min(leadAll,3);
  for(var i=0;i<leadAll-leadShow;i++) cells.push({d:0,other:true,blank:true,date:null});
  for(var i=leadShow-1;i>=0;i--) cells.push({d:prevDim-i,other:true,date:null});
  for(var d=1;d<=dim;d++){ var ds=y+'-'+pad(mo+1)+'-'+pad(d); cells.push({d:d,other:false,date:ds}); }
  cells.forEach(function(c){
    if(c.blank){ html+='<div class="cal-cell blank"></div>'; return; }
    var dow=(c.date?parseDate(c.date).getDay():0);
    var cls='cal-cell'+(c.other?' other':'')+(c.date===today?' today':'')+(dow===0||dow===6?' weekend':'');
    var tasksHtml='';
    if(c.date&&byDate[c.date]){
      var list=byDate[c.date].slice().sort(function(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99');});
      var maxShow=10;
      list.slice(0,maxShow).forEach(function(t){
        var tag=(t.endDate&&t.endDate!==t.date)?'<span class="ktag">跨</span>':'';
        var sc=statusColor(t.status);
        var fg=fgOn(sc);
        tasksHtml+='<div class="cal-task" style="background:'+sc+';color:'+fg+'" onclick="event.stopPropagation();openDay(\''+c.date+'\')">'+tag+'<span style="color:'+typeColor(t.deviceType)+';font-weight:500">'+esc(calLabel(t))+'</span></div>';
      });
      if(list.length>maxShow) tasksHtml+='<div class="cal-more">+'+(list.length-maxShow)+'</div>';
    }
    html+='<div class="'+cls+'" onclick="openDay(\''+(c.date||'')+'\')">'
      +'<div class="cal-num">'+c.d+'</div>'
      +'<div class="cal-tasks">'+tasksHtml+'</div></div>';
  });
  grid.innerHTML=html;
}

/* ================= 日期详情 ================= */
function openDay(dateStr){
  if(!dateStr) return;
  STATE.selDate=dateStr;
  var layer=openSheet(dateStr+' '+weekCN(dateStr)+' · 0 项', '<div class="empty">加载中…</div>');
  layer.__date=dateStr;
  layer.__refresh=function(){
    var list=STATE.tasks.filter(function(t){ return t.date && t.date<=dateStr && (t.endDate||t.date)>=dateStr; });
    list.sort(function(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99');});
    var html='';
    if(!list.length) html='<div class="empty">这一天还没有安排任务</div>';
    list.forEach(function(t){
      var isMid=t.endDate&&t.endDate>dateStr;
      html+='<div class="day-item" onclick="openTask(\''+t.id+'\')">'
        +'<div class="day-time"><div class="hm">'+(t.time||'--:--')+'</div></div>'
        +'<div class="day-main"><div class="tt" style="color:'+typeColor(t.deviceType)+'">'+(isMid?'<span class="tag" style="background:var(--accSoft);color:var(--acc)">跨天·'+t.date.slice(5)+'~'+t.endDate.slice(5)+'</span>':'')+esc(taskTitle(t))+'</div>'
        +'<div class="ts">'+esc(t.address||'')+'<span class="sep" style="margin:0 4px">·</span>'+STATUS[t.status]+'</div></div>'
        +'<div class="stripe" style="width:4px;align-self:stretch;background:'+statusColor(t.status)+';border-radius:2px"></div>'
        +'</div>';
    });
    layer.querySelector('.sheet-body').innerHTML=html
      +'<div style="display:flex;gap:10px;margin-top:16px">'
      +'<button class="btn" style="flex:1" onclick="openTaskForm(\''+dateStr+'\')">在此天添加任务</button>'
      +'<button class="btn ghost" style="flex:1" onclick="showRouteView(\''+dateStr+'\')">顺路编排到此天</button>'
      +'</div>';
    layer.querySelector('.st').textContent=dateStr+' '+weekCN(dateStr)+' · '+list.length+' 项';
  };
  layer.__refresh();
}

function saveTask(){
  var title=document.getElementById('f_title').value.trim();
  if(!title){ toast('请填写任务标题'); return; }
  var type=document.getElementById('f_type').value;
  if(type==='__new'){
    var nn=document.getElementById('f_newtype').value.trim();
    if(!nn){ toast('请填写新类别名称'); return; }
    type=nn;
    if(!STATE.types[type]){ STATE.types[type]=pickColor(); }
  }
  var d={
    title:title, deviceType:type,
    date:document.getElementById('f_date').value||'',
    time:document.getElementById('f_time').value||'',
    endDate:document.getElementById('f_endDate')?document.getElementById('f_endDate').value:'',
    reportNo:document.getElementById('f_reportNo').value.trim(),
    count:+document.getElementById('f_count').value||1,
    projectName:document.getElementById('f_project')?document.getElementById('f_project').value.trim():'',
    maintCo:document.getElementById('f_maint')?document.getElementById('f_maint').value.trim():'',
    address:document.getElementById('f_address').value.trim(),
    area:(document.getElementById('f_area')||{value:''}).value.trim(),
    contact:document.getElementById('f_contact').value.trim(),
    phone:document.getElementById('f_phone').value.trim(),
    productType:readProdTags(),
    time125:document.getElementById('f_time125').value.trim(),
    nextCheckDate:document.getElementById('f_next').value,
    note:document.getElementById('f_note').value.trim(),
    status:document.getElementById('f_status').value
  };
  if(d.endDate && d.date && d.endDate<d.date){ toast('结束日期不能早于开始日期'); return; }
  if(!d.area) d.area=guessArea(d.address);
  d.loc=resolveLoc(d.address)||resolveLoc(d.area);
  if(STATE.editingId){
    var t=STATE.tasks.find(function(x){return x.id===STATE.editingId;});
    var cleared=[];
    Object.keys(d).forEach(function(k){
      var ov=t[k];
      if(ov!=null&&ov!==''&&(d[k]==null||d[k]==='')) cleared.push(k);
    });
    if(cleared.length) t._cleared=Array.from(new Set((t._cleared||[]).concat(cleared)));
    Object.keys(d).forEach(function(k){ t[k]=d[k]; });
    toast('已保存');
  }else{
    d.id=uid(); d.postponeCount=0; d.postponedDates=[];
    STATE.tasks.push(d);
    toast('已添加任务');
  }
  saveAll(); renderAll(); closeSheet();
  refreshTopLayer();
  refreshTopLayer();
}
function pickColor(){
  var palette=['#FF3B30','#FF9500','#FFCC00','#34C759','#00BFA5','#5AC8FA','#007AFF','#5856D6','#AF52DE','#FF2D55'];
  var used=Object.keys(STATE.types).map(function(k){return STATE.types[k];});
  for(var i=0;i<palette.length;i++){ if(used.indexOf(palette[i])<0) return palette[i]; }
  return '#5856D6';
}

    +'<div id="routeList"></div>';

var ROUTE_CLUSTER_MIN=10;
function clusterMin(a,b){
  if(!a||!b||a.lat==null||a.lng==null||b.lat==null||b.lng==null) return 99;
  var sp=STATE.set.speedKmh||25;
  var km=haversine(a.lat,a.lng,b.lat,b.lng)*1.4;
  return Math.max(1, Math.round(km/(sp/60)));
}
function clusterRoute(){
  var groups=[];
  STATE.tasks.forEach(function(t){
    if(t.status!=='pending') return;
    if(!t.loc||t.loc.lat==null){
      var ug=null;
      for(var i=0;i<groups.length;i++) if(groups[i].unloc){ ug=groups[i]; break; }
      if(!ug){ ug={unloc:true, items:[]}; groups.push(ug); }
      ug.items.push(t); return;
    }
    var target=null;
    for(var i=0;i<groups.length;i++){
      var g=groups[i];
      if(g.unloc) continue;
      for(var j=0;j<g.items.length;j++){
        if(clusterMin(t.loc, g.items[j].loc)<=ROUTE_CLUSTER_MIN){ target=g; break; }
      }
      if(target) break;
    }
    if(target) target.items.push(t);
    else groups.push({rep:t, items:[t]});
  });
  return groups;
}
function renderRouteBody(){
  var groups=clusterRoute();
  var html='';
  groups.forEach(function(g){
    if(g.unloc){
      html+='<div style="margin-top:12px"><div style="font-size:13px;font-weight:600;color:var(--red);margin-bottom:6px">无法定位 '+g.items.length+' 项（排序时放最后）</div>';
      g.items.forEach(function(t){ html+=routeTaskItem(t); });
      html+='</div>';
      return;
    }
    var allOn=g.items.every(function(t){return STATE.routeSel[t.id];});
    var label=(g.rep.loc&&g.rep.loc.district?g.rep.loc.district:'附近')+' · 邻近组';
    html+='<div style="margin-top:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
      +'<span style="font-size:13px;font-weight:600;color:var(--sub)">'+esc(label)+' <span style="color:var(--hint);font-weight:400">'+g.items.length+' 项 · 车程≤10分钟</span></span>'
      +'<button class="btn sm ghost" onclick="groupToggle(\''+g.rep.id+'\')">'+(allOn?'取消全选':'全选')+'</button></div>';
    g.items.forEach(function(t){ html+=routeTaskItem(t); });
    html+='</div>';
  });
  if(!groups.length) html='<div class="empty">没有待安排任务</div>';
  var list=document.getElementById('routeList');
  if(list) list.innerHTML=html;
  updateRouteCount();
}

    +'<div class="chk'+(sel?' on':'')+'">'+(sel?CHECK_SVG:'')+'</div>'
    +'<div class="stripe" style="background:'+statusColor(t.status)+'"></div>'
    +'<div class="t-main"><div class="t-title" style="color:'+typeColor(t.deviceType)+'">'+esc(taskTitle(t))+'</div>'
    +'<div class="t-sub">'+(t.loc?esc(t.loc.district):'<span style="color:var(--hint)">地址待补充</span>')+'<span class="sep">·</span>'+esc(t.reportNo||'无单号')+'</div></div></div>';

function planSelectedRouteOffline(date,sel){
  var start=DISTRICTS[STATE.set.startDistrict]||{lat:30.674,lng:104.062};
  var startLoc={lat:start.lat,lng:start.lng,district:STATE.set.startDistrict};
  var located=sel.filter(function(t){return t.loc;});
  var unloc=sel.filter(function(t){return !t.loc;});
  var cur=startLoc, seq=[], remain=located.slice();
  while(remain.length){
    var bi=-1,bd=999;
    for(var i=0;i<remain.length;i++){ var d=driveMin(cur,remain[i].loc); if(d<bd){bd=d;bi=i;} }
    if(bi<0) break;
    seq.push({t:remain[bi],min:bd}); remain.splice(bi,1);
    cur=seq[seq.length-1].t.loc;
  }
  unloc.forEach(function(t){ seq.push({t:t,min:null}); });
  STATE.routeSorted={date:date,seq:seq};
  renderRouteResult(date,seq,false);
}
function planSelectedRouteOnline(date,sel){
  var res=document.getElementById('routeResult');
  var start=DISTRICTS[STATE.set.startDistrict]||{lat:30.674,lng:104.062};
  var startLoc={lat:start.lat,lng:start.lng,district:STATE.set.startDistrict};
  var located=sel.filter(function(t){return t.loc;});
  var unloc=sel.filter(function(t){return !t.loc;});
  var total=located.length;
  res.innerHTML='<div class="empty">正在获取高德真实路况…<br><span style="font-size:11px">解析坐标 0/'+total+'</span></div>';
  var locs={};
  var errs=[];
  var done=0;
  var geos=located.map(function(t){
    return amapGeocode(t.address||t.loc.district)
      .then(function(loc){ locs[t.id]=loc; done++; res.innerHTML='<div class="empty">正在获取高德真实路况…<br><span style="font-size:11px">解析坐标 '+done+'/'+total+'</span></div>'; })
      .catch(function(e){ locs[t.id]=null; errs.push((t.title||'?').slice(0,12)+'：'+(e&&e.message||e)); done++; });
  });
  Promise.all(geos).then(function(){
    var remain=located.slice();
    var seq=[];
    var round=0;
    function step(cur){
      round++;
      res.innerHTML='<div class="empty">正在计算真实车程…<br><span style="font-size:11px">第 '+round+' 轮 · 剩余 '+remain.length+' 个任务</span></div>';
      if(!remain.length){ finish(); return; }
      var cands=remain.slice().sort(function(a,b){ return driveMin(cur,locs[a.id]||a.loc)-driveMin(cur,locs[b.id]||b.loc); }).slice(0,6);
      var jobs=cands.map(function(t){
        var loc=locs[t.id]||t.loc;
        return amapDrive(cur,loc).then(function(min){ return {t:t,min:min}; }).catch(function(e){ errs.push((t.title||'?').slice(0,12)+'：'+(e&&e.message||e)); return null; });
      });
      Promise.all(jobs).then(function(rs){
        var ok=rs.filter(Boolean);
        if(!ok.length){ finish(); return; }
        ok.sort(function(a,b){return a.min-b.min;});
        var best=ok[0];
        seq.push(best);
        remain.splice(remain.indexOf(best.t),1);
        step(locs[best.t.id]||best.t.loc);
      });
    }
    function finish(){
      unloc.forEach(function(t){ seq.push({t:t,min:null}); });
      STATE.routeSorted={date:date,seq:seq};
      renderRouteResult(date,seq,true,errs);
    }
    step(startLoc);
  }).catch(function(e){
    res.innerHTML='<div style="padding:14px 16px;background:#FFF0EF;border-radius:12px;font-size:13px;color:var(--red);margin-top:12px">高德路线获取失败，已回退离线估算：'+esc((e&&e.message)||e)+'</div>';
    planSelectedRouteOffline(date,sel);
  });
}
function renderRouteResult(date,seq,online,errs){
  var tMin=STATE.set.taskMinutes||90, startTime=STATE.set.startTime||'09:00';
  var html='<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">'
    +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">推荐路线（贪心最近原则 · 不走回头路）</div>'
    +'<div style="font-size:12px;color:'+(online?'var(--green)':'var(--hint)')+';margin-bottom:10px">车程计算：'+(online?'高德实时路况（联网）':'离线估算（未启用高德或请求失败）')+'</div>';
  if(errs&&errs.length){
    var over=errs.some(function(e){return /OVER_LIMIT|超限|QUOTA/i.test(String(e));});
    html+='<div style="font-size:12px;color:var(--orange);margin-bottom:10px;background:#FFF8E6;padding:8px 10px;border-radius:8px;line-height:1.6">'
      +(over?'⚠️ 今日高德免费额度已用完（接口超限），以下任务车程已用离线估算补齐；额度每天约 1000 次，明天自动恢复。<br>':'⚠️ 高德部分请求未成功（'+errs.length+' 项），已用离线估算补齐：<br>')
      +errs.slice(0,3).map(esc).join('<br>')+'</div>';
  }
  if(!seq.length){
    html+='<div class="empty">没有可排序的任务</div>';
  }else{
    var clock=startTime;
    seq.forEach(function(item,i){
      var far=item.min!=null&&item.min>20;
      html+='<div class="route-step"><div class="idx">'+(i+1)+'</div>'
        +'<div class="rt"><div class="a" style="color:'+typeColor(item.t.deviceType)+'">'+esc(taskTitle(item.t))+'</div>'
        +'<div class="b">'+(item.t.loc?esc(item.t.loc.district):'<span style="color:var(--hint)">无法定位</span>')+'<span class="sep">·</span>'+(item.min==null?'—':(item.min+' 分钟'+(far?' <span style="color:var(--orange)">(较远)</span>':'')))+'</div></div>'
        +'<div class="tm">'+clock+'</div></div>';
      if(item.min!=null) clock=addMinutes(clock,(item.t.durationMin||tMin)+(i<seq.length-1&&seq[i+1].min?seq[i+1].min:0));
    });
    html+='<div style="font-size:12px;color:var(--hint);margin-top:8px">开始时间 = 每个任务 '+tMin+' 分钟检验时长 + 上一站车程推算（设置可调）。</div>';
  }
  html+='<div class="form-actions">'
    +(seq.length?'<button class="btn" onclick="applyRouteSelected()">确认安排到 '+date.slice(5)+'（'+seq.length+' 个任务）</button>':'')
    +'<button class="btn ghost" onclick="refreshRoute()">重新选择</button></div></div>';
  document.getElementById('routeResult').innerHTML=html;
  document.getElementById('routeResult').scrollIntoView({behavior:'smooth',block:'start'});
}
function applyRouteSelected(){
  var rs=STATE.routeSorted; if(!rs||!rs.seq.length) return;

/* ================= 高德地图（联网精准路线） ================= */
function geoCache(){ try{return JSON.parse(localStorage.getItem(P+'geocache')||'{}');}catch(e){return {};} }
function saveGeoCache(c){ localStorage.setItem(P+'geocache',JSON.stringify(c)); }
function driveCache(){ try{return JSON.parse(localStorage.getItem(P+'drivecache')||'{}');}catch(e){return {};} }
function saveDriveCache(c){ localStorage.setItem(P+'drivecache',JSON.stringify(c)); }
function jsonp(url,timeout){
  return new Promise(function(resolve,reject){
    var cb='_cb'+Math.random().toString(36).slice(2,8);
    var full=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb;
    var s=document.createElement('script');
    window[cb]=function(data){ cleanup(); resolve(data); };
    function cleanup(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); clearTimeout(timer); }
    var timer=setTimeout(function(){ cleanup(); reject(new Error('请求超时')); }, timeout||6000);
    s.onerror=function(){ cleanup(); reject(new Error('网络错误')); };
    s.src=full;
    document.head.appendChild(s);
  });
}
function amapGet(url){
  var ctrl=null;
  try{ if(window.AbortController) ctrl=new AbortController(); }catch(e){}
  var timer=setTimeout(function(){ if(ctrl) ctrl.abort(); }, 6000);
  var doFetch=fetch(url, ctrl?{signal:ctrl.signal}:{})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ clearTimeout(timer); return d; })
    .catch(function(e){ clearTimeout(timer); throw new Error(e&&e.name==='AbortError'?'请求超时':'网络错误'); });
  return doFetch.catch(function(){ return jsonp(url,6000); });
}
function amapGeocode(address){
  var c=geoCache();
  if(c[address]) return Promise.resolve(c[address]);
  return amapGet('https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(address)+'&city='+encodeURIComponent('成都')+'&key='+encodeURIComponent(STATE.set.mapKey)).then(function(d){
    if(d.status==='1'&&d.geocodes&&d.geocodes.length){
      var g=d.geocodes[0].location.split(',');
      var loc={lng:+g[0],lat:+g[1],district:d.geocodes[0].district||''};
      c[address]=loc; saveGeoCache(c);
      return loc;
    }
    throw new Error('坐标解析失败：高德返回 '+(d.infocode||'')+' '+(d.info||d.error||'未知'));
  });
}
function amapDrive(from,to){
  var key=from.lng+','+from.lat+'|'+to.lng+','+to.lat;
  var c=driveCache();
  if(c[key]) return Promise.resolve(c[key]);
  return amapGet('https://restapi.amap.com/v3/direction/driving?origin='+from.lng+','+from.lat+'&destination='+to.lng+','+to.lat+'&strategy=10&key='+encodeURIComponent(STATE.set.mapKey)).then(function(d){
    if(d.status==='1'&&d.route&&d.route.paths&&d.route.paths.length){
      var min=Math.max(1,Math.round(d.route.paths[0].duration/60));
      c[key]=min; saveDriveCache(c);
      return min;
    }
    throw new Error('车程查询失败：高德返回 '+(d.infocode||'')+' '+(d.info||d.error||'未知'));
  });
}

function openTransfer(){
  var html='<div style="font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.7">把本机数据「生成一段代码」，复制后到另一台设备（手机/电脑）打开工作台，同样点顶部⇄图标，粘贴导入即可完成互通。按任务合并，不覆盖各自已有数据。</div>'
    +'<div class="set-group"><h4>① 生成本机互通代码</h4>'
    +'<button class="btn" style="width:100%" onclick="generateCode()">生成并自动复制</button>'
    +'<textarea id="txCode" class="sms-text" style="margin-top:10px;min-height:80px;font-size:12px" readonly placeholder="点上方按钮生成代码…"></textarea></div>'
    +'<div class="set-group"><h4>② 从对方代码导入</h4>'
    +'<textarea id="txImport" class="sms-text" style="min-height:80px;font-size:12px" placeholder="粘贴对方生成的代码…"></textarea>'
    +'<div class="form-actions" style="margin-top:10px"><button class="btn" style="flex:1" onclick="importCode()">导入并合并</button></div>'
    +'<div id="txResult" style="font-size:13px;margin-top:10px"></div></div>';
  openSheet('手机/电脑数据互通', html);
}
function generateCode(){
  try{
    var code=encodeData();
    var ta=document.getElementById('txCode');
    ta.value=code;
    copyText(code);
    toast('代码已生成并复制（'+Math.round(code.length/1024)+' KB），到另一台设备完整粘贴导入');
  }catch(e){
    toast('生成失败：'+e.message);
  }
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); });
  }else{
    fallbackCopy(t);
  }
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function importCode(){
  var v=document.getElementById('txImport').value.trim();
  var res=document.getElementById('txResult');
  if(!v){ res.innerHTML='<span style="color:var(--orange)">请先粘贴对方生成的代码</span>'; return; }
  try{
    var d=decodeData(v);
    var r=mergeIncoming(d);
    res.innerHTML='<span style="color:var(--green)">互通完成：新增 '+r.add+' 条，更新 '+r.upd+' 条，当前共 '+STATE.tasks.length+' 条任务。</span>';
    setTimeout(closeSheet,1500);
  }catch(e){
    res.innerHTML='<span style="color:var(--red)">导入失败：'+esc(e.message)+'</span>';
  }
}
function encodeData(){
  var obj={v:1,types:STATE.types,cols:STATE.cols,tasks:STATE.tasks};
  var s=JSON.stringify(obj);
  return 'JYCODE1:'+btoa(unescape(encodeURIComponent(s)));
}
function decodeData(code){
  var c=String(code||'').trim();
  var m=c.match(/^JYCODE1:([\s\S]+)$/);
  if(!m) throw new Error('代码格式不正确：请确认复制完整（以 JYCODE1: 开头，包含全部内容）。若是微信粘贴可能被截断或带了多余内容，建议直接全选复制');
  var raw=m[1].trim();
  if(!raw) throw new Error('代码内容为空');
  var s;
  try{ s=decodeURIComponent(escape(atob(raw))); }
  catch(e){ throw new Error('代码不完整或已损坏（复制时被截断），请重新完整复制'); }
  var d;
  try{ d=JSON.parse(s); }
  catch(e){ throw new Error('代码内容解析失败（可能复制不完整），请重新完整复制'); }
  if(!d||!Array.isArray(d.tasks)) throw new Error('代码内容无效');
  return d;
}
function mergeIncoming(d){
  var byId={};
  STATE.tasks.forEach(function(t){ if(t.id) byId[t.id]=t; });
  var add=0,upd=0;
  (d.tasks||[]).forEach(function(t){
    if(!t.id) return;
    if(byId[t.id]){ byId[t.id]=mergeTaskObj(byId[t.id],t); upd++; }
    else{ byId[t.id]=t; add++; }
  });
  STATE.tasks=Object.keys(byId).map(function(k){return byId[k];});
  if(d.types) STATE.types=Object.assign({},DEFAULT_TYPES,d.types);
  if(d.cols) STATE.cols=Object.assign({},DEFAULT_COLS,d.cols);
  saveAll(); renderAll();
  return {add:add,upd:upd};
}

function exportJSON(){
  var data={version:1, exportedAt:todayStr(), tasks:STATE.tasks, deviceTypes:STATE.types, statusColors:STATE.cols, settings:STATE.set};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='检验工作台备份_'+todayStr()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},300);
  toast('备份文件已下载');
}
function importJSON(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(d.tasks&&Array.isArray(d.tasks)){
        STATE.tasks=d.tasks;
        if(d.deviceTypes) STATE.types=Object.assign({},DEFAULT_TYPES,d.deviceTypes);
        if(d.statusColors) STATE.cols=Object.assign({},DEFAULT_COLS,d.statusColors);
        if(d.settings) STATE.set=Object.assign({},DEFAULT_SETTINGS,d.settings);
        saveAll(); renderAll();
        toast('导入成功，共 '+d.tasks.length+' 条任务');
      }else{
        toast('文件格式不正确');
      }
    }catch(e){ toast('导入失败：文件不是有效的备份'); }
  };
  rd.readAsText(f);
  input.value='';
}
